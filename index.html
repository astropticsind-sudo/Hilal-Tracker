<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instrumen Falak Digital Pro - HUD Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        
        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: black;
            color: #ffffff;
            overflow: hidden;
            touch-action: none;
        }

        .hud-line {
            background: rgba(255, 255, 255, 0.1);
        }

        .scanline {
            background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.05) 50%);
            background-size: 100% 4px;
            pointer-events: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #f59e0b;
            border: 2px solid white;
        }

        .capture-flash {
            animation: flash-anim 0.2s ease-out forwards;
        }

        @keyframes flash-anim {
            0% { background: white; opacity: 1; }
            100% { background: transparent; opacity: 0; }
        }

        /* Modal styling */
        .modal-blur {
            backdrop-filter: blur(10px);
            background: rgba(0,0,0,0.8);
        }
    </style>
</head>
<body class="bg-black">

    <div id="app" class="relative w-full h-screen overflow-hidden">
        <!-- Area Visualisasi Utama (Luas) -->
        <div class="absolute inset-0 z-0">
            <video id="video" autoplay playsinline class="w-full h-full object-cover opacity-70"></video>
            <canvas id="overlay-canvas" class="absolute inset-0 z-20 pointer-events-none"></canvas>
            <div id="flash-overlay" class="absolute inset-0 z-[100] pointer-events-none"></div>
            <div class="absolute inset-0 scanline z-10"></div>
        </div>

        <!-- HUD: Skala Altitude & Azimuth Terintegrasi -->
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-30">
            <div class="relative w-[80vh] h-[80vh] border border-white/10 rounded-full flex items-center justify-center">
                <div class="absolute w-full h-px bg-white/20"></div>
                <div class="absolute h-full w-px bg-white/20"></div>
                
                <div id="hud-alt-scale" class="absolute h-full flex flex-col justify-between py-10 transition-transform duration-150"></div>
                <div id="hud-az-scale" class="absolute w-full flex justify-between px-10 transition-transform duration-150"></div>
            </div>
        </div>

        <!-- Informasi Lokasi & Jam (Kecil) -->
        <div class="absolute top-6 left-1/2 -translate-x-1/2 flex flex-col items-center gap-1 z-50 pointer-events-none">
            <div id="clock-display" class="text-2xl font-black tracking-[0.3em] text-white drop-shadow-md">00:00:00</div>
            <div class="flex gap-4 text-[9px] font-bold text-gray-400 uppercase">
                <span id="date-display">---</span>
                <span id="gps-status" class="text-red-500">GPS: MENCARI...</span>
            </div>
        </div>

        <!-- Data Posisi (HUD Samping) -->
        <div class="absolute left-6 top-1/2 -translate-y-1/2 flex flex-col gap-4 z-40 pointer-events-none">
            <div class="bg-black/40 backdrop-blur-md p-3 rounded-lg border-l-2 border-orange-500">
                <p class="text-[8px] text-orange-400 font-bold mb-1 uppercase">Matahari</p>
                <p class="text-[10px] text-white">AZ: <span id="sun-az">---</span></p>
                <p class="text-[10px] text-white">AL: <span id="sun-al">---</span></p>
            </div>
            <div class="bg-black/40 backdrop-blur-md p-3 rounded-lg border-l-2 border-yellow-500">
                <p class="text-[8px] text-yellow-500 font-bold mb-1 uppercase">Bulan / Hilal</p>
                <p class="text-[10px] text-white">AZ: <span id="moon-az">---</span></p>
                <p class="text-[10px] text-white">AL: <span id="moon-al">---</span></p>
            </div>
            
            <!-- Lokasi Panel dengan Tombol Manual -->
            <div class="bg-black/40 backdrop-blur-md p-3 rounded-lg border-l-2 border-blue-500 pointer-events-auto">
                <div class="flex justify-between items-center mb-1">
                    <p class="text-[8px] text-blue-400 font-bold uppercase">Lokasi</p>
                    <button onclick="toggleManualGPS()" class="text-[7px] bg-blue-500/20 text-blue-300 px-1 rounded border border-blue-500/30">EDIT</button>
                </div>
                <p class="text-[9px] text-white font-bold" id="coords-val">0.0000, 0.0000</p>
                <p id="gps-mode-tag" class="text-[7px] text-gray-500 mt-1 uppercase">AUTO GPS</p>
            </div>
        </div>

        <!-- Voice Note -->
        <div class="absolute bottom-40 left-1/2 -translate-x-1/2 z-40">
            <div class="bg-yellow-500/20 px-4 py-1 rounded-full border border-yellow-500/50 backdrop-blur-sm">
                <p class="text-[9px] font-bold text-yellow-500 uppercase tracking-widest">Katakan "SHOOT" untuk mengambil gambar</p>
            </div>
        </div>

        <!-- Kontrol Simulasi -->
        <div class="absolute bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-xl z-50 pointer-events-auto">
            <div class="bg-black/80 backdrop-blur-xl p-5 rounded-2xl border border-white/10 shadow-2xl">
                <div class="flex flex-col gap-4">
                    <div class="flex items-center gap-4">
                        <span class="text-[9px] font-bold text-gray-500 w-12 text-center">WAKTU</span>
                        <input id="time-slider" type="range" min="-720" max="720" value="0" class="flex-1 h-1 bg-white/10 rounded-lg appearance-none cursor-pointer">
                        <button onclick="resetTime()" class="p-2 bg-white/5 rounded-lg text-white"><i data-lucide="refresh-cw" size="14"></i></button>
                    </div>
                    <div class="flex justify-between items-center text-[10px] font-bold text-white uppercase">
                        <button onclick="adjustDay(-1)" class="p-2 border border-white/10 rounded-lg"><i data-lucide="chevron-left" size="14"></i></button>
                        <div class="flex flex-col items-center">
                           <span id="sim-date" class="text-yellow-500">-- --- ----</span>
                           <span id="mode-label" class="text-[8px] text-gray-500">REAL-TIME MODE</span>
                        </div>
                        <button onclick="adjustDay(1)" class="p-2 border border-white/10 rounded-lg"><i data-lucide="chevron-right" size="14"></i></button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tombol Target & Kalibrasi -->
        <div class="absolute right-6 top-1/2 -translate-y-1/2 flex flex-col gap-2 z-50 pointer-events-auto">
            <button onclick="setTarget('moon')" id="btn-moon" class="p-4 rounded-xl bg-yellow-500 text-black shadow-lg transition-all">
                <i data-lucide="moon" size="20"></i>
            </button>
            <button onclick="setTarget('sun')" id="btn-sun" class="p-4 rounded-xl bg-white/5 text-white border border-white/10">
                <i data-lucide="sun" size="20"></i>
            </button>
            <button onclick="calibrateSensor()" class="p-4 rounded-full bg-orange-500/20 text-orange-500 border border-orange-500/50 mt-4">
                <i data-lucide="target" size="20"></i>
            </button>
        </div>

        <!-- MODAL MANUAL GPS -->
        <div id="gps-modal" class="absolute inset-0 z-[300] modal-blur hidden flex items-center justify-center p-6">
            <div class="bg-slate-900 border border-white/20 p-6 rounded-3xl w-full max-w-xs shadow-2xl">
                <h3 class="text-white font-black text-sm mb-4 uppercase tracking-tighter">Input Lokasi Manual</h3>
                <div class="space-y-4">
                    <div>
                        <label class="text-[10px] text-gray-400 block mb-1">LATITUDE (LS/LU)</label>
                        <input id="input-lat" type="number" step="any" placeholder="-6.9175" class="w-full bg-black border border-white/10 rounded-lg p-3 text-white text-xs outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="text-[10px] text-gray-400 block mb-1">LONGITUDE (BT)</label>
                        <input id="input-lon" type="number" step="any" placeholder="107.6191" class="w-full bg-black border border-white/10 rounded-lg p-3 text-white text-xs outline-none focus:border-blue-500">
                    </div>
                    <div class="flex gap-2 pt-2">
                        <button onclick="closeGPSModal()" class="flex-1 py-3 text-[10px] font-bold text-gray-400 uppercase">Batal</button>
                        <button onclick="saveManualGPS()" class="flex-1 py-3 bg-blue-600 text-white text-[10px] font-bold rounded-xl uppercase">Simpan</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Overlay Izin -->
        <div id="overlay" class="absolute inset-0 z-[200] bg-black flex items-center justify-center p-12 text-center">
            <div class="max-w-xs">
                <i data-lucide="compass" class="mx-auto mb-6 text-yellow-500" size="48"></i>
                <h2 class="text-xl font-black text-white mb-2 uppercase tracking-tighter">Instrumen Falak Pro</h2>
                <p class="text-[10px] text-gray-500 leading-relaxed mb-10 uppercase tracking-widest">Mengaktifkan Sensor Kamera, GPS, dan Suara...</p>
                <button onclick="initApp()" class="w-full py-4 bg-yellow-500 text-black font-black text-xs rounded-xl shadow-xl active:scale-95 transition-transform tracking-widest">
                    MULAI INSTRUMEN
                </button>
            </div>
        </div>
    </div>

    <script>
        let orientation = { alpha: 0, beta: 0 };
        let calOffset = { alpha: 0, beta: 0 };
        let simulatedTime = new Date();
        let isAutoTime = true;
        let isManualGPS = false;
        let currentTarget = 'moon';
        let locationData = { lat: -6.1751, lon: 106.8650 }; // Default Jakarta

        const canvas = document.getElementById('overlay-canvas');
        const ctx = canvas.getContext('2d');
        lucide.createIcons();

        function generateScales() {
            const altScale = document.getElementById('hud-alt-scale');
            const azScale = document.getElementById('hud-az-scale');
            altScale.innerHTML = '';
            azScale.innerHTML = '';
            
            for (let i = 90; i >= -90; i -= 10) {
                const mark = document.createElement('div');
                mark.className = 'flex items-center gap-2';
                mark.innerHTML = `<div class="w-4 h-px bg-white/30"></div><span class="text-[8px] text-white/50">${i}°</span>`;
                altScale.appendChild(mark);
            }

            for (let i = -90; i <= 90; i += 10) {
                const mark = document.createElement('div');
                mark.className = 'flex flex-col items-center gap-1';
                mark.innerHTML = `<span class="text-[8px] text-white/50">${i}°</span><div class="h-4 w-px bg-white/30"></div>`;
                azScale.appendChild(mark);
            }
        }

        async function initApp() {
            document.getElementById('overlay').classList.add('hidden');
            resizeCanvas();
            generateScales();
            startCamera();
            startGPS();
            initVoice();
            
            if (window.DeviceOrientationEvent) {
                if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                    const state = await DeviceOrientationEvent.requestPermission();
                    if (state === 'granted') window.addEventListener('deviceorientation', handleOrientation);
                } else {
                    window.addEventListener('deviceorientation', handleOrientation);
                }
            }
            window.addEventListener('resize', resizeCanvas);
            updateTimeDisplay();
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function startCamera() {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
                .then(s => document.getElementById('video').srcObject = s)
                .catch(e => console.error("Kamera gagal"));
        }

        function startGPS() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(
                    pos => {
                        if (!isManualGPS) {
                            locationData.lat = pos.coords.latitude;
                            locationData.lon = pos.coords.longitude;
                            updateLocationDisplay();
                            document.getElementById('gps-status').innerText = "GPS: AKTIF";
                            document.getElementById('gps-status').className = "text-green-500";
                        }
                    },
                    err => {
                        if (!isManualGPS) {
                            document.getElementById('gps-status').innerText = "GPS: ERROR";
                            document.getElementById('gps-status').className = "text-red-500";
                        }
                    },
                    { enableHighAccuracy: true }
                );
            }
        }

        // FUNGSI GPS MANUAL
        function toggleManualGPS() {
            document.getElementById('input-lat').value = locationData.lat;
            document.getElementById('input-lon').value = locationData.lon;
            document.getElementById('gps-modal').classList.remove('hidden');
        }

        function closeGPSModal() {
            document.getElementById('gps-modal').classList.add('hidden');
        }

        function saveManualGPS() {
            const lat = parseFloat(document.getElementById('input-lat').value);
            const lon = parseFloat(document.getElementById('input-lon').value);
            
            if (!isNaN(lat) && !isNaN(lon)) {
                locationData.lat = lat;
                locationData.lon = lon;
                isManualGPS = true;
                updateLocationDisplay();
                document.getElementById('gps-mode-tag').innerText = "MANUAL MODE";
                document.getElementById('gps-mode-tag').classList.replace('text-gray-500', 'text-blue-400');
                document.getElementById('gps-status').innerText = "GPS: MANUAL";
                document.getElementById('gps-status').className = "text-blue-400";
                closeGPSModal();
                updateUI();
            }
        }

        function updateLocationDisplay() {
            document.getElementById('coords-val').innerText = `${locationData.lat.toFixed(4)}, ${locationData.lon.toFixed(4)}`;
        }

        function initVoice() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return;
            const rec = new SpeechRecognition();
            rec.continuous = true;
            rec.onresult = e => {
                const transcript = e.results[e.results.length - 1][0].transcript.toLowerCase();
                if (transcript.includes('shoot')) takePhoto();
            };
            rec.start();
        }

        function handleOrientation(e) {
            let az = e.alpha ? (360 - e.alpha) : 0;
            let alt = e.beta ? (e.beta - 90) : 0;
            orientation.alpha = (az + calOffset.alpha + 360) % 360;
            orientation.beta = alt + calOffset.beta;
            updateUI();
        }

        function updateUI() {
            const sun = calculatePos(simulatedTime, 0); 
            const moon = calculatePos(simulatedTime, 8); 

            document.getElementById('sun-az').innerText = sun.az.toFixed(1) + "°";
            document.getElementById('sun-al').innerText = sun.al.toFixed(1) + "°";
            document.getElementById('moon-az').innerText = moon.az.toFixed(1) + "°";
            document.getElementById('moon-al').innerText = moon.al.toFixed(1) + "°";

            document.getElementById('hud-alt-scale').style.transform = `translateY(${orientation.beta * 4}px)`;
            document.getElementById('hud-az-scale').style.transform = `translateX(${orientation.alpha * 4}px)`;

            drawAR(sun, moon);
        }

        function drawAR(sun, moon) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const sf = 40; 

            const toScreen = (pos) => ({
                x: cx + (pos.az - orientation.alpha) * sf,
                y: cy + (orientation.beta - pos.al) * sf
            });

            const sPos = toScreen(sun);
            const mPos = toScreen(moon);

            ctx.beginPath();
            ctx.setLineDash([5, 5]);
            ctx.strokeStyle = "rgba(255,255,255,0.2)";
            ctx.moveTo(sPos.x, sPos.y);
            ctx.lineTo(mPos.x, mPos.y);
            ctx.stroke();

            ctx.fillStyle = "rgba(249, 115, 22, 0.6)";
            ctx.beginPath(); ctx.arc(sPos.x, sPos.y, 25, 0, Math.PI*2); ctx.fill();
            
            ctx.fillStyle = "rgba(234, 179, 8, 0.8)";
            ctx.beginPath(); ctx.arc(mPos.x, mPos.y, 15, 0, Math.PI*2); ctx.fill();
        }

        function calculatePos(time, offset) {
            const h = time.getHours() + time.getMinutes()/60;
            // Sederhana: Simulasi gerak harian berdasarkan waktu dan lokasi dasar
            return {
                az: (90 + (h - 6) * 15 + offset + (locationData.lon - 106.8)/15) % 360,
                al: 90 * Math.sin((h - 6) * Math.PI / 12) + (locationData.lat + 6.2)
            };
        }

        function takePhoto() {
            const flash = document.getElementById('flash-overlay');
            flash.classList.remove('capture-flash');
            void flash.offsetWidth; 
            flash.classList.add('capture-flash');
        }

        function setTarget(t) {
            currentTarget = t;
            document.getElementById('btn-moon').className = t === 'moon' ? 'p-4 rounded-xl bg-yellow-500 text-black shadow-lg' : 'p-4 rounded-xl bg-white/5 text-white border border-white/10';
            document.getElementById('btn-sun').className = t === 'sun' ? 'p-4 rounded-xl bg-yellow-500 text-black shadow-lg' : 'p-4 rounded-xl bg-white/5 text-white border border-white/10';
        }

        function calibrateSensor() {
            const sun = calculatePos(simulatedTime, 0);
            calOffset.alpha = (sun.az - (orientation.alpha - calOffset.alpha));
            calOffset.beta = (sun.al - (orientation.beta - calOffset.beta));
        }

        function adjustDay(d) {
            isAutoTime = false;
            simulatedTime.setDate(simulatedTime.getDate() + d);
            updateTimeDisplay();
        }

        function resetTime() {
            isAutoTime = true;
            simulatedTime = new Date();
            updateTimeDisplay();
        }

        function updateTimeDisplay() {
            document.getElementById('clock-display').innerText = simulatedTime.toLocaleTimeString('id-ID', { hour12: false });
            document.getElementById('date-display').innerText = simulatedTime.toLocaleDateString('id-ID', { day:'numeric', month:'short', year:'numeric' }).toUpperCase();
            document.getElementById('sim-date').innerText = simulatedTime.toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' }).toUpperCase();
            document.getElementById('mode-label').innerText = isAutoTime ? "REAL-TIME MODE" : "SIMULASI AKTIF";
            updateUI();
        }

        setInterval(() => {
            if (isAutoTime) {
                simulatedTime = new Date();
                updateTimeDisplay();
            }
        }, 1000);
    </script>
</body>
</html>
