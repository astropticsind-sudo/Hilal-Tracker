<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instrumen Falak Pro - Stellarium Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        
        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: black;
            color: #ffffff;
            overflow: hidden;
            touch-action: none;
        }

        .scanline {
            background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.05) 50%);
            background-size: 100% 4px;
            pointer-events: none;
        }

        .info-panel {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #f59e0b;
            cursor: pointer;
            border: 2px solid white;
        }

        /* Navigasi Skala */
        .scale-mark {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.4);
            font-size: 9px;
        }
    </style>
</head>
<body class="bg-black">

    <div id="app" class="relative w-full h-screen overflow-hidden">
        <!-- Background: Kamera & Canvas AR -->
        <div class="absolute inset-0 z-0">
            <video id="video" autoplay playsinline class="w-full h-full object-cover opacity-50"></video>
            <canvas id="overlay-canvas" class="absolute inset-0 z-20 pointer-events-none"></canvas>
            <div class="absolute inset-0 scanline z-10"></div>
        </div>

        <!-- Crosshair Sentral -->
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-30">
            <div class="relative w-full h-full flex items-center justify-center">
                <!-- Lingkaran Crosshair -->
                <div class="w-16 h-16 border border-yellow-500/30 rounded-full"></div>
                <div class="absolute w-32 h-px bg-gradient-to-r from-transparent via-yellow-500/50 to-transparent"></div>
                <div class="absolute h-32 w-px bg-gradient-to-b from-transparent via-yellow-500/50 to-transparent"></div>
            </div>
        </div>

        <!-- Skala Azimut (Tengah - Horizontal) -->
        <div class="absolute top-1/2 left-0 w-full h-12 -translate-y-[100px] pointer-events-none z-20 flex items-center overflow-hidden">
            <div id="hud-az-scale" class="flex items-end gap-10 transition-transform duration-75 ease-out px-[50vw]">
                <!-- Dihasilkan oleh JS -->
            </div>
            <div class="absolute left-1/2 -translate-x-1/2 bottom-0 w-px h-6 bg-yellow-500 shadow-[0_0_8px_#eab308]"></div>
        </div>

        <!-- Skala Altitude (Tengah - Vertikal) -->
        <div class="absolute top-0 left-1/2 h-full w-12 -translate-x-[150px] pointer-events-none z-20 flex flex-col justify-center overflow-hidden">
            <div id="hud-alt-scale" class="flex flex-col items-end gap-8 transition-transform duration-75 ease-out py-[50vh]">
                <!-- Dihasilkan oleh JS -->
            </div>
            <div class="absolute top-1/2 -translate-y-1/2 right-0 h-px w-6 bg-yellow-500 shadow-[0_0_8px_#eab308]"></div>
        </div>

        <!-- Header & Clock -->
        <div class="absolute top-4 left-1/2 -translate-x-1/2 flex flex-col items-center z-50 pointer-events-none">
            <div id="clock-display" class="text-2xl font-black tracking-widest text-white/90 drop-shadow-lg">00:00:00</div>
            <div class="flex gap-4 text-[9px] font-bold text-gray-500 uppercase tracking-widest mt-0.5">
                <span id="date-display">-- --- ----</span>
            </div>
        </div>

        <!-- Panel Data Matahari (Turun sedikit) -->
        <div class="absolute left-4 top-20 z-40 w-48 pointer-events-none">
            <div class="info-panel p-3 rounded-2xl border-l-2 border-orange-500/40">
                <div class="flex items-center justify-between mb-1">
                    <div class="flex items-center gap-1.5">
                        <i data-lucide="sun" size="12" class="text-orange-400"></i>
                        <span class="text-[9px] text-orange-400 font-bold uppercase">Matahari</span>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-x-2 text-[9px]">
                    <span class="text-gray-500 uppercase">Az/Alt</span><span id="sun-pos" class="text-white text-right">---</span>
                    <span class="text-gray-500 uppercase">Ra/Dec</span><span id="sun-ra" class="text-white text-right">---</span>
                </div>
            </div>
        </div>

        <!-- Panel Data Bulan (Turun sedikit) -->
        <div class="absolute right-4 top-20 z-40 w-48 pointer-events-none">
            <div class="info-panel p-3 rounded-2xl border-r-2 border-yellow-500/40">
                <div class="flex items-center justify-between mb-1">
                    <div class="flex items-center gap-1.5 text-right ml-auto">
                        <span class="text-[9px] text-yellow-400 font-bold uppercase">Bulan</span>
                        <i data-lucide="moon" size="12" class="text-yellow-400"></i>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-x-2 text-[9px]">
                    <span class="text-gray-500 uppercase">Az/Alt</span><span id="moon-pos" class="text-white text-right">---</span>
                    <span class="text-gray-500 uppercase">Ra/Dec</span><span id="moon-ra" class="text-white text-right">---</span>
                </div>
            </div>
        </div>

        <!-- Kontrol Bawah -->
        <div class="absolute bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-xl z-50 flex flex-col gap-3 pointer-events-auto">
            
            <!-- Baris Pengaturan Tanggal & Tracker -->
            <div class="flex items-end justify-between px-2">
                <div class="flex flex-col gap-2">
                    <button onclick="editDate()" class="p-2 rounded-full info-panel border border-white/10 text-white/70 hover:text-white transition-colors">
                        <i data-lucide="calendar" size="16"></i>
                    </button>
                    <button onclick="focusTarget('sun')" class="px-3 py-1.5 rounded-full info-panel border border-orange-500/20 text-[8px] font-bold text-orange-400 uppercase flex items-center gap-1">
                        <i data-lucide="sun" size="10"></i> Track Sun
                    </button>
                </div>

                <div class="flex gap-2 mb-0.5">
                    <button id="sync-sun-btn" onclick="syncWithSun()" class="px-3 py-1.5 rounded-full info-panel border border-blue-500/20 text-[8px] font-bold text-blue-400 uppercase flex items-center gap-1">
                        <i data-lucide="refresh-cw" size="10"></i> Sync Sun
                    </button>
                    <button onclick="focusTarget('moon')" class="px-3 py-1.5 rounded-full info-panel border border-yellow-500/20 text-[8px] font-bold text-yellow-400 uppercase flex items-center gap-1">
                        <i data-lucide="moon" size="10"></i> Track Moon
                    </button>
                    <button onclick="toggleGpsMode()" id="gps-btn" class="px-3 py-1.5 rounded-full info-panel border border-green-500/20 text-[8px] font-bold text-green-400 uppercase flex items-center gap-1">
                        <i data-lucide="map-pin" size="10"></i> <span id="gps-status-label">Auto GPS</span>
                    </button>
                </div>
            </div>

            <!-- Panel Waktu & Kontrol Manual -->
            <div class="info-panel p-4 rounded-[2rem]">
                <div class="flex flex-col gap-3">
                    <div class="flex items-center gap-3">
                        <button onclick="stepTime(-1)" class="p-1 text-white/30"><i data-lucide="minus" size="14"></i></button>
                        <input id="time-slider" type="range" min="-1440" max="1440" value="0" class="flex-1 h-1 bg-white/10 rounded-full appearance-none cursor-pointer">
                        <button onclick="stepTime(1)" class="p-1 text-white/30"><i data-lucide="plus" size="14"></i></button>
                        <button onclick="resetApp()" class="p-2 hover:bg-white/10 rounded-full text-white/50"><i data-lucide="zap" size="14"></i></button>
                    </div>
                    
                    <div class="flex justify-between items-center px-2">
                        <button onclick="changeDay(-1)" class="text-white/40"><i data-lucide="chevrons-left" size="20"></i></button>
                        <div class="text-center cursor-pointer" onclick="manualTimeInput()">
                            <span id="display-mode" class="text-[7px] font-black text-yellow-500 uppercase tracking-[0.3em] block">REAL TIME</span>
                            <span id="sim-date-label" class="text-[10px] font-bold text-white/80">00:00:00 - -- ---</span>
                        </div>
                        <button onclick="changeDay(1)" class="text-white/40"><i data-lucide="chevrons-right" size="20"></i></button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Start Overlay -->
        <div id="start-overlay" class="absolute inset-0 z-[100] bg-slate-950 flex items-center justify-center p-10 text-center">
            <div class="max-w-xs">
                <i data-lucide="compass" class="text-yellow-500 mx-auto mb-6" size="64"></i>
                <h1 class="text-2xl font-black text-white mb-2 tracking-tighter uppercase">HILAL TRACKER</h1>
                <p class="text-[9px] text-gray-500 mb-8 tracking-[0.2em] uppercase">CLICK HERE TO FIND</p>
                <button onclick="initApp()" class="w-full py-4 bg-yellow-500 text-black font-black text-[10px] rounded-xl uppercase tracking-widest shadow-xl">Kalibrasi Instrumen</button>
            </div>
        </div>
    </div>

    <script>
        let orientation = { alpha: 0, beta: 0 };
        let observerLocation = { lat: -6.2, lon: 106.8 };
        let currentTime = new Date();
        let isRealTime = true;
        let gpsMode = 'auto'; // 'auto' or 'manual'

        const canvas = document.getElementById('overlay-canvas');
        const ctx = canvas.getContext('2d');
        const toRad = (d) => d * Math.PI / 180;
        const toDeg = (r) => r * 180 / Math.PI;

        function initApp() {
            document.getElementById('start-overlay').classList.add('hidden');
            lucide.createIcons();
            startSensors();
            startCamera();
            setupScales();
            resizeCanvas();
            setInterval(updateClock, 1000);
            requestAnimationFrame(renderLoop);
        }

        // Perbaikan format dan rasio visualisasi Skala
        function setupScales() {
            const azScale = document.getElementById('hud-az-scale');
            const altScale = document.getElementById('hud-alt-scale');
            azScale.innerHTML = '';
            altScale.innerHTML = '';

            // Azimut: 360 derajat, per 5 derajat
            for (let i = 0; i <= 360; i += 5) {
                let label = (i % 360);
                if(label === 0) label = "U";
                if(label === 90) label = "T";
                if(label === 180) label = "S";
                if(label === 270) label = "B";
                
                const isMajor = i % 10 === 0;
                azScale.innerHTML += `
                    <div class="flex flex-col items-center min-w-[50px]">
                        <span class="text-[7px] ${isMajor ? 'text-white/60 font-bold' : 'text-white/20'}">${label}</span>
                        <div class="w-px ${isMajor ? 'h-3' : 'h-1.5'} bg-white/30 mt-1"></div>
                    </div>
                `;
            }

            // Altitude: +90 s/d -90, per 5 derajat
            for (let i = 90; i >= -90; i -= 5) {
                const isMajor = i % 10 === 0;
                altScale.innerHTML += `
                    <div class="flex items-center justify-end min-h-[40px] w-full">
                        <span class="text-[7px] mr-2 ${isMajor ? 'text-white/60 font-bold' : 'text-white/20'}">${i}°</span>
                        <div class="h-px ${isMajor ? 'w-3' : 'w-1.5'} bg-white/30"></div>
                    </div>
                `;
            }
        }

        function toggleGpsMode() {
            if (gpsMode === 'auto') {
                const manual = prompt("Masukkan Koordinat (Lat, Lon):", `${observerLocation.lat}, ${observerLocation.lon}`);
                if (manual) {
                    const [lat, lon] = manual.split(',').map(Number);
                    if (!isNaN(lat) && !isNaN(lon)) {
                        observerLocation.lat = lat;
                        observerLocation.lon = lon;
                        gpsMode = 'manual';
                        document.getElementById('gps-status-label').innerText = "Manual GPS";
                        document.getElementById('gps-btn').classList.replace('border-green-500/20', 'border-blue-500/20');
                        document.getElementById('gps-btn').classList.replace('text-green-400', 'text-blue-400');
                    }
                }
            } else {
                gpsMode = 'auto';
                document.getElementById('gps-status-label').innerText = "Auto GPS";
                document.getElementById('gps-btn').classList.replace('border-blue-500/20', 'border-green-500/20');
                document.getElementById('gps-btn').classList.replace('text-blue-400', 'text-green-400');
                startSensors(); 
            }
        }

        function editDate() {
            const dateInput = prompt("Masukkan Tanggal (YYYY-MM-DD):", currentTime.toISOString().split('T')[0]);
            if (dateInput) {
                const newDate = new Date(dateInput);
                if (!isNaN(newDate)) {
                    isRealTime = false;
                    currentTime.setFullYear(newDate.getFullYear(), newDate.getMonth(), newDate.getDate());
                    updateClock();
                }
            }
        }

        function manualTimeInput() {
            const timeInput = prompt("Masukkan Jam (HH:mm):", currentTime.toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'}));
            if (timeInput) {
                const [h, m] = timeInput.split(':').map(Number);
                if (!isNaN(h) && !isNaN(m)) {
                    isRealTime = false;
                    currentTime.setHours(h, m, 0);
                    updateClock();
                }
            }
        }

        function stepTime(mins) {
            isRealTime = false;
            currentTime = new Date(currentTime.getTime() + mins * 60000);
            updateClock();
        }

        function syncWithSun() {
            // Melakukan kalibrasi azimut berdasarkan posisi matahari saat ini
            const data = calculateAstro(currentTime, observerLocation.lat, observerLocation.lon);
            orientation.alpha = data.sun.az;
            alert(`Kompas disinkronkan ke Azimut Matahari: ${data.sun.az.toFixed(2)}°`);
        }

        function startSensors() {
            if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientation', (e) => {
                    if(e.alpha !== null) {
                        orientation.alpha = (360 - e.alpha) % 360;
                        orientation.beta = e.beta - 90;
                    }
                });
            }

            if (gpsMode === 'auto') {
                navigator.geolocation.getCurrentPosition(p => {
                    observerLocation.lat = p.coords.latitude;
                    observerLocation.lon = p.coords.longitude;
                });
            }
        }

        function calculateAstro(date, lat, lon) {
            const jd = (date.getTime() / 86400000) + 2440587.5;
            const d = jd - 2451545.0;

            const g = (357.529 + 0.9856003 * d) % 360;
            const q = (280.459 + 0.98564736 * d) % 360;
            const L = (q + 1.915 * Math.sin(toRad(g)) + 0.020 * Math.sin(toRad(2 * g))) % 360;
            const e = 23.439 - 0.00000036 * d;

            const sunRA = toDeg(Math.atan2(Math.cos(toRad(e)) * Math.sin(toRad(L)), Math.cos(toRad(L))));
            const sunDec = toDeg(Math.asin(Math.sin(toRad(e)) * Math.sin(toRad(L))));

            const Lp = (218.316 + 13.176396 * d) % 360;
            const Mp = (134.963 + 13.064993 * d) % 360;
            const F = (93.272 + 13.229350 * d) % 360;
            const moonRA = Lp + 6.289 * Math.sin(toRad(Mp));
            const moonDec = 5.128 * Math.sin(toRad(F));

            const GMST = (18.697374558 + 24.06570982441908 * d) % 24;
            const LST = (GMST * 15 + lon) % 360;

            const getAzAlt = (ra, dec) => {
                const ha = (LST - ra + 360) % 360;
                const alt = toDeg(Math.asin(Math.sin(toRad(lat)) * Math.sin(toRad(dec)) + Math.cos(toRad(lat)) * Math.cos(toRad(dec)) * Math.cos(toRad(ha))));
                let az = toDeg(Math.atan2(Math.sin(toRad(ha)), Math.cos(toRad(ha)) * Math.sin(toRad(lat)) - Math.tan(toRad(dec)) * Math.cos(toRad(lat))));
                return { az: (az + 180) % 360, alt: alt, ra, dec };
            };

            return { sun: getAzAlt(sunRA, sunDec), moon: getAzAlt(moonRA, moonDec) };
        }

        function renderLoop() {
            const data = calculateAstro(currentTime, observerLocation.lat, observerLocation.lon);
            
            document.getElementById('sun-pos').innerText = `${data.sun.az.toFixed(1)}° / ${data.sun.alt.toFixed(1)}°`;
            document.getElementById('sun-ra').innerText = `${Math.floor(data.sun.ra/15)}j ${Math.floor((data.sun.ra%15)*4)}m`;
            document.getElementById('moon-pos').innerText = `${data.moon.az.toFixed(1)}° / ${data.moon.alt.toFixed(1)}°`;
            document.getElementById('moon-ra').innerText = `${Math.floor(data.moon.ra/15)}j ${Math.floor((data.moon.ra%15)*4)}m`;

            // Rasio pergerakan skala: 50px per 5 derajat = 10px/derajat
            const azOffset = (orientation.alpha % 360) * 10;
            const altOffset = orientation.beta * 8; // 40px per 5 derajat = 8px/derajat

            document.getElementById('hud-az-scale').style.transform = `translateX(${-azOffset}px)`;
            document.getElementById('hud-alt-scale').style.transform = `translateY(${altOffset}px)`;

            drawAR(data);
            requestAnimationFrame(renderLoop);
        }

        function drawAR(data) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const scale = 30; // 30 pixel per derajat untuk AR jangkauan luas

            const project = (pos) => {
                let dAz = pos.az - orientation.alpha;
                if (dAz > 180) dAz -= 360;
                if (dAz < -180) dAz += 360;
                return {
                    x: cx + (dAz * scale),
                    y: cy + ((orientation.beta - pos.alt) * scale)
                };
            };

            const sPos = project(data.sun);
            const mPos = project(data.moon);

            // Sun AR
            ctx.shadowBlur = 40; ctx.shadowColor = "orange";
            ctx.fillStyle = "rgba(255, 140, 0, 0.4)";
            ctx.beginPath(); ctx.arc(sPos.x, sPos.y, 40, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = "rgba(255,255,255,0.4)"; ctx.lineWidth = 2; ctx.stroke();

            // Moon AR
            ctx.shadowColor = "white";
            ctx.fillStyle = "rgba(200, 230, 255, 0.6)";
            ctx.beginPath(); ctx.arc(mPos.x, mPos.y, 25, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = "rgba(255,255,255,0.2)"; ctx.stroke();
            
            ctx.shadowBlur = 0;
        }

        function focusTarget(type) {
            const data = calculateAstro(currentTime, observerLocation.lat, observerLocation.lon);
            const target = type === 'sun' ? data.sun : data.moon;
            orientation.alpha = target.az;
            orientation.beta = -target.alt;
        }

        function updateClock() {
            if (isRealTime) currentTime = new Date();
            const timeStr = currentTime.toLocaleTimeString('id-ID', { hour12: false });
            const dateStrShort = currentTime.toLocaleDateString('id-ID', { day:'2-digit', month:'short', year:'numeric' }).toUpperCase();
            const dateStrLong = currentTime.toLocaleDateString('id-ID', { day:'2-digit', month:'long', year:'numeric' }).toUpperCase();
            
            document.getElementById('clock-display').innerText = timeStr;
            document.getElementById('date-display').innerText = dateStrShort;
            document.getElementById('sim-date-label').innerText = `${timeStr} - ${dateStrLong}`;
        }

        document.getElementById('time-slider').oninput = (e) => {
            isRealTime = false;
            document.getElementById('display-mode').innerText = "SIMULASI";
            document.getElementById('display-mode').classList.add('text-orange-500');
            const now = new Date();
            currentTime = new Date(now.getTime() + e.target.value * 60000);
            updateClock();
        };

        function resetApp() {
            isRealTime = true;
            document.getElementById('time-slider').value = 0;
            document.getElementById('display-mode').innerText = "REAL TIME";
            document.getElementById('display-mode').classList.remove('text-orange-500');
            updateClock();
        }

        function changeDay(offset) {
            isRealTime = false;
            currentTime.setDate(currentTime.getDate() + offset);
            updateClock();
        }

        function startCamera() {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
                .then(stream => document.getElementById('video').srcObject = stream)
                .catch(() => console.log("Kamera tidak tersedia"));
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
    </script>
</body>
</html>
