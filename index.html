<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AstroCam AR - Find The Sun & Moon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; color: #00ffcc; font-family: 'Courier New', Courier, monospace; }
        
        /* Lapisan Kamera & Canvas */
        #video-feed { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 10; pointer-events: none; }
        
        /* Container UI (HUD) */
        .hud-container { position: absolute; width: 100%; height: 100%; z-index: 20; pointer-events: none; }
        
        /* Elemen UI Atas */
        .top-bar { 
            position: absolute; top: 0; left: 0; width: 100%; padding: 15px; 
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); 
            display: flex; justify-content: space-between; align-items: flex-start; 
            pointer-events: auto; 
        }
        
        /* Kotak Data */
        .data-box { 
            background: rgba(0, 20, 0, 0.6); border: 1px solid #00ffcc; 
            padding: 5px 12px; border-radius: 4px; font-size: 12px; font-weight: bold;
            text-shadow: 0 0 5px #00ffcc; margin-bottom: 5px; 
        }
        
        /* Crosshair Statis (Tengah Layar) */
        .crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            pointer-events: none; z-index: 30;
        }
        .crosshair-circle {
            width: 60px; height: 60px; border: 2px solid rgba(0, 255, 204, 0.8);
            border-radius: 50%; box-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
            display: flex; justify-content: center; align-items: center;
        }
        .crosshair-dot {
            width: 4px; height: 4px; background: #ff3333; border-radius: 50%;
            box-shadow: 0 0 5px #ff0000;
        }
        .crosshair-line-h { position: absolute; width: 80px; height: 1px; background: rgba(0,255,204,0.5); top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .crosshair-line-v { position: absolute; width: 1px; height: 80px; background: rgba(0,255,204,0.5); top: 50%; left: 50%; transform: translate(-50%, -50%); }

        /* Kontrol Bawah */
        .bottom-controls { 
            position: absolute; bottom: 0; left: 0; width: 100%; padding: 20px; padding-bottom: 40px; 
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); 
            display: flex; flex-direction: column; align-items: center; gap: 15px; 
            pointer-events: auto; 
        }
        
        /* Tombol Aksi (Find Sun/Moon) */
        .btn-action { 
            background: rgba(0, 50, 50, 0.6); border: 1px solid #00ffcc; color: #00ffcc; 
            padding: 12px 25px; border-radius: 30px; cursor: pointer; font-weight: bold; 
            text-transform: uppercase; transition: all 0.3s; font-size: 14px;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.1);
        }
        .btn-action:active, .btn-action.active { 
            background: #00ffcc; color: #000; box-shadow: 0 0 20px #00ffcc; 
        }

        /* Tombol Shutter */
        .shutter-btn {
            width: 70px; height: 70px; border-radius: 50%; border: 3px solid #fff;
            background: rgba(255,255,255,0.2); cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            transition: 0.2s;
        }
        .shutter-btn:active { background: rgba(255,255,255,0.8); transform: scale(0.95); }

        /* Tombol Suara */
        .voice-container { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .mic-btn {
            width: 45px; height: 45px; border-radius: 50%; border: 1px solid #00ffcc;
            background: rgba(0,0,0,0.6); color: #00ffcc; display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: 0.3s; font-size: 18px;
        }
        .mic-btn.listening { background: #ff3333; border-color: #ff3333; color: white; animation: pulse 1.5s infinite; }
        .voice-label {
            font-size: 10px; color: #fff; margin-top: 5px; text-shadow: 0 0 2px black;
            text-align: center; opacity: 0.9; letter-spacing: 0.5px;
        }

        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 51, 51, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(255, 51, 51, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 51, 51, 0); } }

        /* Panah Penunjuk (Find Feature) */
        .guide-arrow {
            position: absolute; width: 0; height: 0; 
            z-index: 15; opacity: 0; transition: opacity 0.3s; pointer-events: none;
            filter: drop-shadow(0 0 5px #000);
        }
        .guide-arrow.up { border-left: 20px solid transparent; border-right: 20px solid transparent; border-bottom: 30px solid #ffcc00; top: 15%; left: 50%; transform: translateX(-50%); }
        .guide-arrow.down { border-left: 20px solid transparent; border-right: 20px solid transparent; border-top: 30px solid #ffcc00; bottom: 25%; left: 50%; transform: translateX(-50%); }
        .guide-arrow.left { border-top: 20px solid transparent; border-bottom: 20px solid transparent; border-right: 30px solid #ffcc00; left: 5%; top: 50%; transform: translateY(-50%); }
        .guide-arrow.right { border-top: 20px solid transparent; border-bottom: 20px solid transparent; border-left: 30px solid #ffcc00; right: 5%; top: 50%; transform: translateY(-50%); }

        /* Modal Izin */
        #permission-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px;
        }
    </style>
</head>
<body>

    <!-- Permission Modal -->
    <div id="permission-modal">
        <h2 class="text-3xl text-cyan-400 mb-2 font-bold"><i class="fas fa-space-shuttle"></i> AstroCam</h2>
        <p class="text-gray-400 mb-8 max-w-xs">Aplikasi Kamera AR Astronomi. Izinkan akses untuk melanjutkan.</p>
        <button onclick="startApp()" class="btn-action" style="font-size: 16px; padding: 15px 40px; border-width: 2px;">MULAI KAMERA</button>
    </div>

    <!-- Video Background -->
    <video id="video-feed" autoplay playsinline muted></video>

    <!-- AR Canvas Layer (Grid & Labels) -->
    <canvas id="ar-canvas"></canvas>

    <!-- Guide Arrows -->
    <div id="arrow-up" class="guide-arrow up"></div>
    <div id="arrow-down" class="guide-arrow down"></div>
    <div id="arrow-left" class="guide-arrow left"></div>
    <div id="arrow-right" class="guide-arrow right"></div>

    <!-- HUD Container -->
    <div class="hud-container">
        <!-- Crosshair (Titik Tengah) -->
        <div class="crosshair">
            <div class="crosshair-line-h"></div>
            <div class="crosshair-line-v"></div>
            <div class="crosshair-circle">
                <div class="crosshair-dot"></div>
            </div>
        </div>

        <!-- Top Info -->
        <div class="top-bar">
            <div>
                <div class="data-box" id="coords">Lat: -- Lon: --</div>
                <div class="data-box" id="orientation">Az: 0° | Alt: 0°</div>
            </div>
            <div class="text-right">
                <div class="data-box text-yellow-400" id="sun-data">SUN: --</div>
                <div class="data-box text-gray-300" id="moon-data">MOON: --</div>
            </div>
        </div>

        <!-- Bottom Controls -->
        <div class="bottom-controls">
            
            <!-- Target Buttons -->
            <div class="flex gap-4 w-full justify-center px-4">
                <button id="btn-sun" class="btn-action flex-1 max-w-[160px]" onclick="toggleTarget('sun')">
                    <i class="fas fa-sun mr-2"></i> FIND THE SUN
                </button>
                <button id="btn-moon" class="btn-action flex-1 max-w-[160px]" onclick="toggleTarget('moon')">
                    <i class="fas fa-moon mr-2"></i> FIND THE MOON
                </button>
            </div>

            <!-- Main Controls Row -->
            <div class="flex items-center justify-between w-full max-w-sm px-4 mt-2">
                <!-- Voice Button -->
                <div class="voice-container">
                    <button id="btn-voice" class="mic-btn" onclick="toggleVoice()">
                        <i class="fas fa-microphone"></i>
                    </button>
                    <span class="voice-label">KATAKAN AMBIL<br>UNTUK MEMOTRET</span>
                </div>

                <!-- Shutter Button -->
                <button class="shutter-btn" onclick="takePhoto()">
                    <div style="width: 55px; height: 55px; background: white; border-radius: 50%;"></div>
                </button>
                
                <!-- Placeholder for balance -->
                <div style="width: 45px;"></div> 
            </div>
        </div>
    </div>

    <script>
        // --- State Management ---
        const state = {
            tracking: null, // 'sun' or 'moon'
            azimuth: 0,     // Compass heading (0-360)
            altitude: 0,    // Pitch (-90 to 90)
            lat: -6.9175,   // Default
            lon: 107.6191,
            sunPos: { az: 0, alt: 0 },
            moonPos: { az: 0, alt: 0 },
            listening: false
        };

        // --- DOM Elements ---
        const video = document.getElementById('video-feed');
        const canvas = document.getElementById('ar-canvas');
        const ctx = canvas.getContext('2d');
        const elCoords = document.getElementById('coords');
        const elOrient = document.getElementById('orientation');
        const elSun = document.getElementById('sun-data');
        const elMoon = document.getElementById('moon-data');
        const btnVoice = document.getElementById('btn-voice');
        const arrows = {
            up: document.getElementById('arrow-up'),
            down: document.getElementById('arrow-down'),
            left: document.getElementById('arrow-left'),
            right: document.getElementById('arrow-right')
        };

        // --- Initialization ---
        function startApp() {
            document.getElementById('permission-modal').style.display = 'none';
            initCamera();
            initSensors();
            initGeolocation();
            
            // Start loops
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();
            requestAnimationFrame(renderLoop);
            setInterval(updateAstroPositions, 1000); 
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        // --- Camera Setup ---
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                video.srcObject = stream;
            } catch (err) {
                console.warn("Camera access failed", err);
                // Fallback for desktop testing
            }
        }

        // --- Voice Recognition ---
        let recognition;
        function initVoice() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.lang = 'id-ID';
                recognition.continuous = true;
                recognition.interimResults = false;

                recognition.onresult = (event) => {
                    const last = event.results.length - 1;
                    const transcript = event.results[last][0].transcript.trim().toLowerCase();
                    console.log("Heard:", transcript);

                    if (transcript.includes('ambil') || transcript.includes('foto') || transcript.includes('potret')) {
                        flashScreen();
                        takePhoto();
                    }
                };
                
                recognition.onend = () => { if (state.listening) recognition.start(); };
                recognition.onerror = () => { state.listening = false; updateVoiceUI(); };

            } else {
                alert("Browser tidak mendukung sensor suara.");
                btnVoice.style.display = 'none';
                document.querySelector('.voice-label').style.display = 'none';
            }
        }

        function toggleVoice() {
            if (!recognition) initVoice();
            state.listening = !state.listening;
            updateVoiceUI();
            if (state.listening) recognition.start();
            else recognition.stop();
        }

        function updateVoiceUI() {
            if (state.listening) btnVoice.classList.add('listening');
            else btnVoice.classList.remove('listening');
        }

        // --- Sensors ---
        function initSensors() {
            if (window.DeviceOrientationEvent && typeof window.DeviceOrientationEvent.requestPermission === 'function') {
                window.DeviceOrientationEvent.requestPermission()
                    .then(r => { if(r==='granted') window.addEventListener('deviceorientation', handleOrientation); })
                    .catch(console.error);
            } else {
                window.addEventListener('deviceorientationabsolute', handleOrientation, true);
                window.addEventListener('deviceorientation', handleOrientation, true);
            }
        }

        function handleOrientation(e) {
            // Compass
            let compass = e.webkitCompassHeading || Math.abs(e.alpha - 360);
            if (!e.webkitCompassHeading && e.alpha) compass = 360 - e.alpha;
            state.azimuth = compass % 360;

            // Pitch (Altitude)
            // Portrait mode: beta is roughly tilt. 90 is upright.
            // We want 0 at horizon (phone upright).
            // Usually beta is 90 when upright. So Altitude = Beta - 90.
            // BUT, for AR apps, we usually take 'beta' directly if holding upright is 90?
            // Let's calibrate: 
            // If phone is vertical (camera looking at horizon), beta is ~90.
            // We want this to display as "0 degrees alt".
            // So: displayAlt = beta - 90.
            let rawBeta = e.beta;
            // Clamping for usability
            if (rawBeta === null) rawBeta = 90; 
            
            // Adjust so 0 is Horizon
            state.altitude = rawBeta - 90;

            // Stabilize/Smooth could go here, but raw is faster
            elOrient.innerText = `Az: ${Math.round(state.azimuth)}° | Alt: ${Math.round(state.altitude)}°`;
        }

        function initGeolocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    state.lat = pos.coords.latitude;
                    state.lon = pos.coords.longitude;
                    elCoords.innerText = `Lat: ${state.lat.toFixed(2)} | Lon: ${state.lon.toFixed(2)}`;
                    updateAstroPositions();
                });
            }
        }

        // --- Astro Logic (Simplified) ---
        function updateAstroPositions() {
            const now = new Date();
            // Mock Data that moves slowly based on time
            const hour = now.getHours() + now.getMinutes()/60;
            
            // Simple Sun Path: East(90) to West(270)
            let sunAz = 180; let sunAlt = -45;
            if (hour >= 6 && hour <= 18) {
                sunAz = 90 + ((hour - 6) / 12) * 180;
                sunAlt = 90 - Math.abs(12 - hour) * 15;
            }
            state.sunPos = { az: sunAz, alt: sunAlt };
            state.moonPos = { az: (sunAz + 180) % 360, alt: 45 };

            elSun.innerText = `SUN: ${Math.round(sunAz)}° / ${Math.round(sunAlt)}°`;
            elMoon.innerText = `MOON: ${Math.round(state.moonPos.az)}° / ${Math.round(state.moonPos.alt)}°`;
        }

        // --- Find Logic ---
        function toggleTarget(target) {
            document.getElementById('btn-sun').classList.remove('active');
            document.getElementById('btn-moon').classList.remove('active');
            
            if (state.tracking === target) {
                state.tracking = null;
                updateArrows(0, 0, false);
            } else {
                state.tracking = target;
                document.getElementById('btn-' + target).classList.add('active');
            }
        }

        function updateArrows(tAz, tAlt, active) {
            if (!active) {
                Object.values(arrows).forEach(a => a.style.opacity = 0);
                return;
            }

            const cAz = state.azimuth;
            const cAlt = state.altitude;

            let dAz = tAz - cAz;
            if (dAz > 180) dAz -= 360;
            if (dAz < -180) dAz += 360;
            
            let dAlt = tAlt - cAlt;

            // Thresholds
            const TH = 5; 
            arrows.left.style.opacity = dAz < -TH ? 1 : 0;
            arrows.right.style.opacity = dAz > TH ? 1 : 0;
            arrows.up.style.opacity = dAlt > TH ? 1 : 0;
            arrows.down.style.opacity = dAlt < -TH ? 1 : 0;
        }

        // --- Rendering ---
        function renderLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const w = canvas.width;
            const h = canvas.height;
            const cx = w / 2;
            const cy = h / 2;
            
            const fov = 60; // Field of View Vertical
            const pxPerDeg = h / fov;

            // 1. Draw Horizon & Altitude Grid
            // Logic: if Pitch is 0 (Horizon), line 0 should be at cy.
            // if Pitch is +10 (Looking Up), line 0 should be at cy + 10deg (Lower on screen).
            
            const currentPitch = state.altitude;

            // Loop lines every 10 degrees
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            for (let deg = -90; deg <= 90; deg += 10) {
                // Calculate Y position relative to center
                // diff = currentPitch - lineDegree.
                // If I look up (pitch=10), line(0) is 10 deg below center.
                const offsetDeg = currentPitch - deg;
                
                // Only draw if visible (within FOV/2 + margin)
                if (Math.abs(offsetDeg) > (fov/2 + 10)) continue;

                const y = cy + (offsetDeg * pxPerDeg);

                // Style based on type
                if (deg === 0) {
                    // Horizon Line (Red)
                    ctx.strokeStyle = '#ff3333';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(0, y); ctx.lineTo(w, y);
                    ctx.stroke();
                    
                    ctx.fillStyle = '#ff3333';
                    ctx.fillText("HORIZON", 40, y - 10);
                } else {
                    // Grid Lines (Cyan transparent)
                    ctx.strokeStyle = 'rgba(0, 255, 204, 0.3)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    // Draw with gap in middle for HUD aesthetics
                    ctx.moveTo(cx - 100, y); ctx.lineTo(cx - 20, y);
                    ctx.moveTo(cx + 20, y); ctx.lineTo(cx + 100, y);
                    ctx.stroke();
                    
                    ctx.fillStyle = 'rgba(0, 255, 204, 0.6)';
                    ctx.font = '12px Courier New';
                    ctx.fillText(deg + "°", cx + 120, y);
                }
            }

            // 2. Draw Compass Strip (Azimuth)
            // Logic: Strip moves left/right.
            // If Az is 0 (North), N is at cx.
            // If Az is 10 (Turn Right), N moves Left (cx - 10deg).
            
            const stripY = h * 0.15;
            const pxPerDegAz = w / 80; // Scale for compass width
            
            // Draw Center Indicator Triangle
            ctx.fillStyle = '#ffcc00';
            ctx.beginPath();
            ctx.moveTo(cx, stripY + 15);
            ctx.lineTo(cx - 5, stripY + 5);
            ctx.lineTo(cx + 5, stripY + 5);
            ctx.fill();

            // Draw Ticks
            const currentAz = state.azimuth;
            for (let i = 0; i < 360; i += 15) {
                let diff = i - currentAz;
                if (diff < -180) diff += 360;
                if (diff > 180) diff -= 360;
                
                // Only draw visible
                if (Math.abs(diff) * pxPerDegAz > w/2) continue;

                const x = cx + diff * pxPerDegAz;
                
                ctx.strokeStyle = '#00ffcc';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(x, stripY); ctx.lineTo(x, stripY - 10);
                ctx.stroke();
                
                let label = i + "°";
                if (i===0) label="N"; if(i===90) label="E"; if(i===180) label="S"; if(i===270) label="W";
                
                ctx.fillStyle = '#00ffcc';
                ctx.fillText(label, x, stripY - 20);
            }

            // 3. Draw Targets (AR Objects)
            if (state.tracking) {
                const target = state.tracking === 'sun' ? state.sunPos : state.moonPos;
                updateArrows(target.az, target.alt, true);
                
                // Convert Target Polar Coords to Screen X,Y
                // Azimuth diff -> X
                let dAz = target.az - currentAz;
                if (dAz > 180) dAz -= 360;
                if (dAz < -180) dAz += 360;
                
                // Altitude diff -> Y
                let dAlt = currentPitch - target.alt; // Positive if target is above center (wait... y is down)
                // If target Alt is 45, current is 0. diff is -45. 
                // Y = cy + (-45 * px). Upwards. Correct.

                const tX = cx + dAz * pxPerDeg; 
                const tY = cy + dAlt * pxPerDeg;

                // Draw if roughly on screen
                if (tX > -100 && tX < w + 100 && tY > -100 && tY < h + 100) {
                    const color = state.tracking === 'sun' ? '#ffff00' : '#ffffff';
                    
                    ctx.save();
                    ctx.translate(tX, tY);
                    
                    // Box corners
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 2;
                    const s = 30; // size
                    ctx.beginPath();
                    ctx.moveTo(-s, -s/2); ctx.lineTo(-s, -s); ctx.lineTo(-s/2, -s);
                    ctx.moveTo(s, -s/2); ctx.lineTo(s, -s); ctx.lineTo(s/2, -s);
                    ctx.moveTo(-s, s/2); ctx.lineTo(-s, s); ctx.lineTo(-s/2, s);
                    ctx.moveTo(s, s/2); ctx.lineTo(s, s); ctx.lineTo(s/2, s);
                    ctx.stroke();

                    // Label
                    ctx.fillStyle = color;
                    ctx.font = "bold 14px Courier New";
                    ctx.fillText(state.tracking.toUpperCase(), 0, -s - 10);
                    ctx.font = "10px Courier New";
                    ctx.fillText(`${target.az.toFixed(0)}° / ${target.alt.toFixed(0)}°`, 0, s + 15);
                    
                    ctx.restore();
                }
            }

            requestAnimationFrame(renderLoop);
        }

        // --- Photo ---
        function flashScreen() {
            const f = document.createElement('div');
            f.style.cssText = "position:fixed;top:0;left:0;w:100%;h:100%;background:white;z-index:999;transition:opacity 0.5s";
            document.body.appendChild(f);
            setTimeout(()=>f.style.opacity=0,50);
            setTimeout(()=>f.remove(),550);
        }

        function takePhoto() {
            flashScreen();
            const temp = document.createElement('canvas');
            temp.width = video.videoWidth || canvas.width;
            temp.height = video.videoHeight || canvas.height;
            const tCtx = temp.getContext('2d');
            
            // Draw Video
            tCtx.drawImage(video, 0, 0, temp.width, temp.height);
            // Draw UI (Fit to video size)
            tCtx.drawImage(canvas, 0, 0, temp.width, temp.height);
            
            const link = document.createElement('a');
            link.download = 'astrocam.png';
            link.href = temp.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
