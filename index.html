<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sky Tracker Pro AR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #video-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.6;
            display: none;
        }
        .sky-bg {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 100%, #1e293b 0%, #020617 70%);
            transition: background 1s ease;
        }
        .grid-line {
            position: absolute;
            height: 100%;
            border-left: 1px solid rgba(255,255,255,0.05);
        }
        .flash {
            position: absolute;
            inset: 0;
            background: white;
            z-index: 100;
            display: none;
        }
        .modal-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 50;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <!-- Layer 1: Kamera -->
    <video id="video-bg" autoplay playsinline></video>

    <!-- Layer 2: Atmosfer (Digital) -->
    <div id="sky-atmos" class="sky-bg"></div>

    <!-- Layer 3: Grid & Objek -->
    <div id="sky-container" class="absolute inset-0 pointer-events-none overflow-hidden">
        <!-- Grid dan Objek akan di-render via JS -->
    </div>

    <!-- Layer 4: Crosshair -->
    <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
        <div class="relative flex items-center justify-center">
            <i data-lucide="crosshair" class="w-10 h-10 text-cyan-400 opacity-40"></i>
            <div class="absolute w-1.5 h-1.5 bg-red-500 rounded-full shadow-[0_0_10px_red]"></div>
        </div>
    </div>

    <div id="flash-effect" class="flash"></div>

    <!-- UI: Sidebar Kiri -->
    <div class="absolute top-6 left-6 space-y-4 pointer-events-auto max-w-[260px]">
        <div class="bg-slate-900/80 backdrop-blur-md p-4 rounded-2xl border border-white/10 shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center gap-2 text-cyan-400">
                    <i data-lucide="compass" id="compass-icon" class="w-5 h-5"></i>
                    <h1 class="text-[10px] font-black uppercase italic tracking-tighter">Sky Tracker Pro</h1>
                </div>
                <button onclick="toggleGyro()" id="gyro-btn" class="text-[9px] px-2 py-1 rounded font-bold bg-white/10 text-white">
                    GYRO: OFF
                </button>
            </div>
            
            <div class="grid grid-cols-2 gap-2 text-center mb-4">
                <div class="bg-black/40 p-2 rounded-lg border border-white/5">
                    <p class="text-[8px] text-white/40 uppercase font-bold">Azimut</p>
                    <p id="az-val" class="text-sm font-mono font-bold text-cyan-400">180°</p>
                </div>
                <div class="bg-black/40 p-2 rounded-lg border border-white/5">
                    <p class="text-[8px] text-white/40 uppercase font-bold">Altitud</p>
                    <p id="alt-val" class="text-sm font-mono font-bold text-cyan-400">0°</p>
                </div>
            </div>

            <div class="space-y-2 border-t border-white/5 pt-3 text-[10px]">
                <div class="flex justify-between items-center cursor-pointer hover:bg-white/5 p-1 rounded" onclick="openModal('time')">
                    <div class="flex items-center gap-2 text-white/60"><i data-lucide="clock" class="w-3 h-3"></i> Waktu</div>
                    <div id="time-display" class="text-cyan-300 font-mono">00:00:00</div>
                </div>
                <div class="flex justify-between items-center cursor-pointer hover:bg-white/5 p-1 rounded" onclick="openModal('gps')">
                    <div class="flex items-center gap-2 text-white/60"><i data-lucide="map-pin" class="w-3 h-3"></i> Lokasi</div>
                    <div id="gps-display" class="text-cyan-300 font-mono">-6.21, 106.85</div>
                </div>
            </div>
        </div>

        <!-- Info Objek -->
        <div class="bg-black/60 backdrop-blur-md p-3 rounded-xl border border-white/10 text-[10px]">
            <p class="text-white/40 mb-2 font-bold uppercase tracking-wider">Posisi Saat Ini</p>
            <div class="space-y-1">
                <div class="flex justify-between"><span class="text-yellow-400">Matahari:</span> <span id="sun-pos">260° / -4°</span></div>
                <div class="flex justify-between"><span class="text-slate-300">Bulan:</span> <span id="moon-pos">265° / 3.5°</span></div>
            </div>
        </div>
    </div>

    <!-- UI: Right Controls -->
    <div class="absolute top-6 right-6 flex flex-col gap-3">
        <button onclick="toggleCamera()" id="camera-btn" class="p-4 rounded-full border backdrop-blur-md transition-all bg-black/40 border-white/20">
            <i data-lucide="camera-off" class="w-6 h-6 text-white/40"></i>
        </button>
        <button onclick="toggleVoice()" id="voice-btn" class="p-4 rounded-full border backdrop-blur-md transition-all bg-black/40 border-white/20">
            <i data-lucide="mic" class="w-6 h-6 text-white/40"></i>
        </button>
    </div>

    <!-- UI: Bottom Navigation -->
    <div class="absolute bottom-10 left-1/2 -translate-x-1/2 flex items-center gap-4 bg-slate-900/80 backdrop-blur-xl px-6 py-3 rounded-3xl border border-white/10 shadow-2xl">
        <button onclick="setMode('hilal')" id="btn-hilal" class="p-3 rounded-xl transition-all bg-white/5 text-white">
            <i data-lucide="sun" class="w-5 h-5"></i>
        </button>
        <div class="w-[1px] h-6 bg-white/10"></div>
        <button onclick="setMode('moon-tracker')" id="btn-moon" class="p-3 rounded-xl transition-all bg-white/5 text-white">
            <i data-lucide="moon" class="w-5 h-5"></i>
        </button>
        <div class="w-[1px] h-6 bg-white/10"></div>
        <button onclick="handleCapture()" class="p-4 bg-white text-black rounded-full hover:scale-105 active:scale-95 transition-transform shadow-xl">
            <div class="w-4 h-4 rounded-full border-2 border-black"></div>
        </button>
    </div>

    <!-- Modal Edit -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="bg-slate-900 border border-white/10 rounded-3xl p-6 w-full max-w-sm mx-4">
            <div class="flex justify-between items-center mb-6 text-white">
                <h2 id="modal-title" class="font-bold flex items-center gap-2 uppercase tracking-tighter">Edit</h2>
                <button onclick="closeModal()"><i data-lucide="x"></i></button>
            </div>
            <div id="modal-content" class="space-y-4">
                <!-- Content injected via JS -->
            </div>
            <button onclick="saveChanges()" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2 mt-6">
                <i data-lucide="save" class="w-4 h-4"></i> Simpan Perubahan
            </button>
        </div>
    </div>

    <!-- Panah Tracker -->
    <div id="moon-guide" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none hidden">
        <i data-lucide="navigation" class="w-8 h-8 text-cyan-400 drop-shadow-[0_0_10px_cyan] rotate-90"></i>
    </div>

    <!-- Label Suara -->
    <div id="voice-label" class="absolute bottom-32 left-1/2 -translate-x-1/2 text-[9px] font-black tracking-widest bg-red-500 text-white px-3 py-1 rounded-full animate-pulse hidden">
        MIC AKTIF: UCAPKAN "AMBIL"
    </div>

    <script>
        // --- State ---
        let rotation = { azimuth: 180, altitude: 0 };
        let locationData = { lat: -6.2088, lng: 106.8456 };
        let objects = {
            sun: { az: 260, alt: -4, name: 'Matahari' },
            moon: { az: 265, alt: 3.5, name: 'Hilal' }
        };
        let activeMode = null;
        let isCameraActive = false;
        let isGyroActive = false;
        let isListening = false;
        let isDragging = false;
        let lastX, lastY;

        // --- Init Lucide Icons ---
        lucide.createIcons();

        // --- Clock Update ---
        setInterval(() => {
            const now = new Date();
            document.getElementById('time-display').innerText = now.toLocaleTimeString('id-ID');
        }, 1000);

        // --- Touch/Mouse Handlers ---
        document.body.addEventListener('mousedown', (e) => {
            if (isGyroActive) return;
            isDragging = true;
            lastX = e.clientX;
            lastY = e.clientY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - lastX;
            const dy = e.clientY - lastY;
            rotation.azimuth = (rotation.azimuth - dx * 0.15 + 360) % 360;
            rotation.altitude = Math.max(-90, Math.min(90, rotation.altitude + dy * 0.15));
            lastX = e.clientX;
            lastY = e.clientY;
            render();
        });

        window.addEventListener('mouseup', () => isDragging = false);

        // --- Gyroscope ---
        function toggleGyro() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            isGyroActive = !isGyroActive;
                            updateGyroUI();
                        }
                    });
            } else {
                isGyroActive = !isGyroActive;
                updateGyroUI();
            }
        }

        function updateGyroUI() {
            const btn = document.getElementById('gyro-btn');
            const icon = document.getElementById('compass-icon');
            btn.innerText = isGyroActive ? 'GYRO: ON' : 'OFF';
            btn.className = isGyroActive ? 'text-[9px] px-2 py-1 rounded font-bold bg-cyan-500 text-black' : 'text-[9px] px-2 py-1 rounded font-bold bg-white/10 text-white';
            if (isGyroActive) {
                window.addEventListener('deviceorientation', handleOrientation);
                icon.classList.add('animate-spin');
            } else {
                window.removeEventListener('deviceorientation', handleOrientation);
                icon.classList.remove('animate-spin');
            }
        }

        function handleOrientation(e) {
            if (!isGyroActive) return;
            rotation.azimuth = e.alpha ? (360 - e.alpha) : rotation.azimuth;
            rotation.altitude = e.beta ? (e.beta - 90) : rotation.altitude;
            render();
        }

        // --- Kamera ---
        async function toggleCamera() {
            const video = document.getElementById('video-bg');
            const atmos = document.getElementById('sky-atmos');
            const btn = document.getElementById('camera-btn');

            if (!isCameraActive) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                    video.srcObject = stream;
                    video.style.display = 'block';
                    atmos.style.opacity = '0';
                    isCameraActive = true;
                    btn.innerHTML = '<i data-lucide="camera" class="w-6 h-6 text-white"></i>';
                    btn.classList.replace('bg-black/40', 'bg-emerald-500');
                    btn.classList.replace('border-white/20', 'border-white');
                } catch (err) {
                    console.error("Kamera ditolak", err);
                }
            } else {
                const stream = video.srcObject;
                stream?.getTracks().forEach(track => track.stop());
                video.style.display = 'none';
                atmos.style.opacity = '1';
                isCameraActive = false;
                btn.innerHTML = '<i data-lucide="camera-off" class="w-6 h-6 text-white/40"></i>';
                btn.classList.replace('bg-emerald-500', 'bg-black/40');
                btn.classList.replace('border-white', 'border-white/20');
            }
            lucide.createIcons();
        }

        // --- Voice Command ---
        function toggleVoice() {
            const btn = document.getElementById('voice-btn');
            const label = document.getElementById('voice-label');
            isListening = !isListening;
            
            if (isListening) {
                btn.classList.replace('bg-black/40', 'bg-red-500');
                btn.classList.add('animate-pulse');
                label.classList.remove('hidden');
                startListening();
            } else {
                btn.classList.replace('bg-red-500', 'bg-black/40');
                btn.classList.remove('animate-pulse');
                label.classList.add('hidden');
                stopListening();
            }
        }

        let recognition;
        function startListening() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return;
            recognition = new SpeechRecognition();
            recognition.lang = 'id-ID';
            recognition.continuous = true;
            recognition.onresult = (event) => {
                const text = event.results[event.results.length - 1][0].transcript.toLowerCase();
                if (text.includes('ambil')) handleCapture();
            };
            recognition.start();
        }
        function stopListening() { if(recognition) recognition.stop(); }

        // --- Capture ---
        function handleCapture() {
            const flash = document.getElementById('flash-effect');
            flash.style.display = 'block';
            setTimeout(() => flash.style.display = 'none', 150);
        }

        // --- Modals ---
        function openModal(type) {
            const overlay = document.getElementById('modal-overlay');
            const title = document.getElementById('modal-title');
            const content = document.getElementById('modal-content');
            overlay.style.display = 'flex';
            
            if (type === 'time') {
                title.innerHTML = '<i data-lucide="calendar" class="w-4 h-4"></i> Edit Waktu & Tanggal';
                content.innerHTML = `
                    <input type="datetime-local" class="w-full bg-black/50 border border-white/10 rounded-xl p-3 text-sm text-cyan-400" value="${new Date().toISOString().slice(0,16)}">
                    <p class="text-[10px] text-white/40 uppercase">Ubah waktu simulasi benda langit.</p>
                `;
            } else {
                title.innerHTML = '<i data-lucide="map-pin" class="w-4 h-4"></i> Edit Koordinat GPS';
                content.innerHTML = `
                    <div class="grid grid-cols-2 gap-3 text-sm">
                        <div class="space-y-1">
                            <label class="text-[9px] uppercase text-white/40">Lat</label>
                            <input type="number" step="0.01" value="${locationData.lat}" class="w-full bg-black/50 border border-white/10 rounded-lg p-2 text-cyan-400">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[9px] uppercase text-white/40">Long</label>
                            <input type="number" step="0.01" value="${locationData.lng}" class="w-full bg-black/50 border border-white/10 rounded-lg p-2 text-cyan-400">
                        </div>
                    </div>
                `;
            }
            lucide.createIcons();
        }

        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
        }

        function saveChanges() {
            closeModal();
            // Logika simpan di sini
        }

        // --- Mode Control ---
        function setMode(mode) {
            activeMode = (activeMode === mode) ? null : mode;
            document.getElementById('btn-hilal').className = (activeMode === 'hilal') ? 'p-3 rounded-xl transition-all bg-amber-500 text-black shadow-lg shadow-amber-500/30 scale-110' : 'p-3 rounded-xl transition-all bg-white/5 text-white';
            document.getElementById('btn-moon').className = (activeMode === 'moon-tracker') ? 'p-3 rounded-xl transition-all bg-cyan-500 text-black shadow-lg shadow-cyan-500/30 scale-110' : 'p-3 rounded-xl transition-all bg-white/5 text-white';
            render();
        }

        // --- Core Rendering ---
        function render() {
            // Update Val UI
            document.getElementById('az-val').innerText = Math.round(rotation.azimuth) + '°';
            document.getElementById('alt-val').innerText = Math.round(rotation.altitude) + '°';
            
            const container = document.getElementById('sky-container');
            container.innerHTML = ''; // Clear previous

            // Render Grid (Simplified for performance)
            [0, 45, 90, 135, 180, 225, 270, 315].forEach(az => {
                let dAz = az - rotation.azimuth;
                if (dAz > 180) dAz -= 360;
                if (dAz < -180) dAz += 360;
                
                const line = document.createElement('div');
                line.className = 'grid-line';
                line.style.left = `calc(50% + ${dAz * 12}px)`;
                const label = document.createElement('span');
                label.className = 'absolute bottom-32 text-[10px] opacity-30 -translate-x-1/2 text-white';
                label.innerText = az + '°';
                line.appendChild(label);
                container.appendChild(line);
            });

            // Render Objects
            Object.entries(objects).forEach(([key, obj]) => {
                let dAz = obj.az - rotation.azimuth;
                if (dAz > 180) dAz -= 360;
                if (dAz < -180) dAz += 360;
                let dAlt = obj.alt - rotation.altitude;

                if (Math.abs(dAz) < 50 && Math.abs(dAlt) < 50) {
                    const el = document.createElement('div');
                    el.className = 'absolute flex flex-col items-center';
                    el.style.left = '50%';
                    el.style.top = '50%';
                    el.style.transform = `translate(-50%, -50%) translate(${dAz * 12}px, ${-dAlt * 12}px)`;
                    
                    if (key === 'sun') {
                        el.innerHTML = `
                            <div class="w-16 h-16 bg-yellow-400 rounded-full blur-[1px] shadow-[0_0_40px_rgba(250,204,21,0.4)]"></div>
                            <div class="mt-2 text-[10px] font-bold bg-black/50 px-2 rounded border border-white/10 uppercase text-white">${obj.name}</div>
                        `;
                    } else {
                        el.innerHTML = `
                            <div class="relative w-12 h-12 bg-slate-100 rounded-full shadow-[0_0_20px_white/20] overflow-hidden">
                                <div class="absolute inset-0 bg-slate-900 translate-x-3 rounded-full"></div>
                            </div>
                            <div class="mt-2 text-[10px] font-bold bg-black/50 px-2 rounded border border-white/10 uppercase text-white">${obj.name}</div>
                        `;
                    }
                    container.appendChild(el);
                }
            });

            // Tracker Arrow
            const moonGuide = document.getElementById('moon-guide');
            if (activeMode === 'moon-tracker') {
                let dAz = objects.moon.az - rotation.azimuth;
                if (dAz > 180) dAz -= 360;
                if (dAz < -180) dAz += 360;
                let dAlt = objects.moon.alt - rotation.altitude;
                let dist = Math.sqrt(dAz*dAz + dAlt*dAlt);
                
                if (dist > 8) {
                    moonGuide.style.display = 'block';
                    let angle = Math.atan2(dAlt, dAz);
                    moonGuide.style.transform = `translate(-50%, -50%) rotate(${-angle}rad) translateX(120px)`;
                } else {
                    moonGuide.style.display = 'none';
                }
            } else {
                moonGuide.style.display = 'none';
            }
        }

        // Initial Render
        render();

    </script>
</body>
</html>
