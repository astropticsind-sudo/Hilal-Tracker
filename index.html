<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instrumen Falak Pro - Stellarium Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        
        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: black;
            color: #ffffff;
            overflow: hidden;
            touch-action: none;
        }

        .scanline {
            background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.05) 50%);
            background-size: 100% 4px;
            pointer-events: none;
        }

        .info-panel {
            background: rgba(15, 23, 42, 0.25);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #f59e0b;
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-black">

    <div id="app" class="relative w-full h-screen overflow-hidden">
        <!-- Background: Kamera & Canvas AR -->
        <div class="absolute inset-0 z-0">
            <video id="video" autoplay playsinline class="w-full h-full object-cover opacity-50"></video>
            <canvas id="overlay-canvas" class="absolute inset-0 z-20 pointer-events-none"></canvas>
            <div class="absolute inset-0 scanline z-10"></div>
        </div>

        <!-- Crosshair & Skala HUD -->
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-30">
            <div class="relative w-64 h-64 border border-white/5 rounded-full flex items-center justify-center">
                <div class="absolute w-8 h-px bg-yellow-500/30"></div>
                <div class="absolute h-8 w-px bg-yellow-500/30"></div>
                <!-- Skala Altitude Vertikal -->
                <div id="hud-alt-scale" class="absolute h-[200vh] flex flex-col justify-between items-center transition-transform duration-100 ease-out opacity-40"></div>
            </div>
            
            <!-- Skala Azimut Horizontal -->
            <div class="absolute top-[15%] w-full h-12 flex items-center justify-center overflow-hidden opacity-40">
                <div id="hud-az-scale" class="flex items-end gap-12 transition-transform duration-100 ease-out"></div>
                <div class="absolute bottom-0 w-px h-6 bg-yellow-500 shadow-[0_0_10px_#eab308]"></div>
            </div>
        </div>

        <!-- Header & Clock -->
        <div class="absolute top-4 left-1/2 -translate-x-1/2 flex flex-col items-center z-50 pointer-events-none">
            <div id="clock-display" class="text-2xl font-black tracking-widest text-white/80">00:00:00</div>
            <div class="flex gap-4 text-[9px] font-bold text-gray-500 uppercase tracking-widest mt-0.5">
                <span id="date-display">-- --- ----</span>
                <span id="gps-status" class="text-yellow-600">Sync...</span>
            </div>
        </div>

        <!-- Panel Data Matahari (Kiri Atas) -->
        <div class="absolute left-4 top-4 z-40 w-48 pointer-events-none">
            <div class="info-panel p-3 rounded-2xl border-l-2 border-orange-500/40">
                <div class="flex items-center justify-between mb-1">
                    <div class="flex items-center gap-1.5">
                        <i data-lucide="sun" size="12" class="text-orange-400"></i>
                        <span class="text-[9px] text-orange-400 font-bold uppercase">Matahari</span>
                    </div>
                    <span id="sun-mag" class="text-[8px] text-orange-200/50">-26.7</span>
                </div>
                <div class="grid grid-cols-2 gap-x-2 text-[9px]">
                    <span class="text-gray-500 uppercase">Az/Alt</span><span id="sun-pos" class="text-white text-right">---</span>
                    <span class="text-gray-500 uppercase">Ra/Dec</span><span id="sun-ra" class="text-white text-right">---</span>
                </div>
            </div>
        </div>

        <!-- Panel Data Bulan (Kanan Atas) -->
        <div class="absolute right-4 top-4 z-40 w-48 pointer-events-none">
            <div class="info-panel p-3 rounded-2xl border-r-2 border-yellow-500/40">
                <div class="flex items-center justify-between mb-1">
                    <span id="moon-mag" class="text-[8px] text-yellow-200/50">-10.2</span>
                    <div class="flex items-center gap-1.5 text-right">
                        <span class="text-[9px] text-yellow-400 font-bold uppercase">Bulan</span>
                        <i data-lucide="moon" size="12" class="text-yellow-400"></i>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-x-2 text-[9px]">
                    <span class="text-gray-500 uppercase">Az/Alt</span><span id="moon-pos" class="text-white text-right">---</span>
                    <span class="text-gray-500 uppercase">Ra/Dec</span><span id="moon-ra" class="text-white text-right">---</span>
                </div>
            </div>
        </div>

        <!-- Lokasi & Kontrol (Bawah) -->
        <div class="absolute bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-xl z-50 flex flex-col gap-3 pointer-events-auto">
            
            <!-- Tombol Tracker (Kecil di atas slider) -->
            <div class="flex justify-center gap-2">
                <button onclick="focusTarget('sun')" class="px-3 py-1.5 rounded-full info-panel border border-orange-500/20 text-[8px] font-bold text-orange-400 uppercase flex items-center gap-1">
                    <i data-lucide="sun" size="10"></i> Track Sun
                </button>
                <button onclick="focusTarget('moon')" class="px-3 py-1.5 rounded-full info-panel border border-yellow-500/20 text-[8px] font-bold text-yellow-400 uppercase flex items-center gap-1">
                    <i data-lucide="moon" size="10"></i> Track Moon
                </button>
                <div id="coords-display" class="px-3 py-1.5 rounded-full info-panel text-[8px] font-bold text-blue-400 uppercase flex items-center gap-1 ml-auto">
                    <i data-lucide="map-pin" size="10"></i> <span id="coords-val">0.0, 0.0</span>
                </div>
            </div>

            <!-- Panel Waktu -->
            <div class="info-panel p-4 rounded-[2rem]">
                <div class="flex flex-col gap-3">
                    <div class="flex items-center gap-3">
                        <input id="time-slider" type="range" min="-1440" max="1440" value="0" class="flex-1 h-1 bg-white/10 rounded-full appearance-none cursor-pointer">
                        <button onclick="resetApp()" class="p-1.5 hover:bg-white/10 rounded-full text-white/50"><i data-lucide="refresh-cw" size="14"></i></button>
                    </div>
                    <div class="flex justify-between items-center px-1">
                        <button onclick="changeDay(-1)" class="p-1.5 text-white/40"><i data-lucide="chevron-left" size="18"></i></button>
                        <div class="text-center">
                            <span id="display-mode" class="text-[7px] font-black text-yellow-500 uppercase tracking-[0.3em] block">REAL TIME</span>
                            <span id="sim-date-label" class="text-[10px] font-bold text-white/70">-- --- ----</span>
                        </div>
                        <button onclick="changeDay(1)" class="p-1.5 text-white/40"><i data-lucide="chevron-right" size="18"></i></button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Overlay Start -->
        <div id="start-overlay" class="absolute inset-0 z-[100] bg-slate-950 flex items-center justify-center p-10 text-center">
            <div class="max-w-xs">
                <i data-lucide="compass" class="text-yellow-500 mx-auto mb-6" size="64"></i>
                <h1 class="text-2xl font-black text-white mb-2 tracking-tighter uppercase">FALAK PRO</h1>
                <p class="text-[9px] text-gray-500 mb-8 tracking-[0.2em] uppercase">Advanced Astro-Navigation</p>
                <button onclick="initApp()" class="w-full py-4 bg-yellow-500 text-black font-black text-[10px] rounded-xl uppercase tracking-widest shadow-xl">Kalibrasi</button>
            </div>
        </div>
    </div>

    <script>
        let orientation = { alpha: 0, beta: 0 };
        let observerLocation = { lat: -6.2, lon: 106.8 };
        let currentTime = new Date();
        let isRealTime = true;
        let pannedAlpha = 0; // Untuk simulasi tracking jika sensor tidak tersedia

        const canvas = document.getElementById('overlay-canvas');
        const ctx = canvas.getContext('2d');

        const toRad = (d) => d * Math.PI / 180;
        const toDeg = (r) => r * 180 / Math.PI;

        function initApp() {
            document.getElementById('start-overlay').classList.add('hidden');
            lucide.createIcons();
            startSensors();
            startCamera();
            setupScales();
            resizeCanvas();
            setInterval(updateClock, 1000);
            requestAnimationFrame(renderLoop);
        }

        function setupScales() {
            const azScale = document.getElementById('hud-az-scale');
            const altScale = document.getElementById('hud-alt-scale');
            azScale.innerHTML = '';
            altScale.innerHTML = '';

            for (let i = -180; i <= 540; i += 10) {
                const norm = (i + 360) % 360;
                let label = norm + "°";
                if(norm === 0) label = "U";
                if(norm === 90) label = "T";
                if(norm === 180) label = "S";
                if(norm === 270) label = "B";
                azScale.innerHTML += `
                    <div class="flex flex-col items-center min-w-[100px]">
                        <span class="text-[8px] font-bold text-white/40">${label}</span>
                        <div class="w-px h-2 bg-white/20 mt-1"></div>
                    </div>
                `;
            }

            for (let i = 90; i >= -90; i -= 10) {
                altScale.innerHTML += `<div class="w-2 h-px bg-white/20"></div>`;
            }
        }

        function startSensors() {
            if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientation', (e) => {
                    orientation.alpha = (360 - e.alpha) % 360;
                    orientation.beta = e.beta - 90;
                });
            }

            navigator.geolocation.getCurrentPosition(p => {
                observerLocation.lat = p.coords.latitude;
                observerLocation.lon = p.coords.longitude;
                document.getElementById('coords-val').innerText = `${observerLocation.lat.toFixed(2)}, ${observerLocation.lon.toFixed(2)}`;
                document.getElementById('gps-status').innerText = "ONLINE";
                document.getElementById('gps-status').className = "text-green-600";
            });
        }

        function calculateAstro(date, lat, lon) {
            const jd = (date.getTime() / 86400000) + 2440587.5;
            const d = jd - 2451545.0;

            const g = (357.529 + 0.9856003 * d) % 360;
            const q = (280.459 + 0.98564736 * d) % 360;
            const L = (q + 1.915 * Math.sin(toRad(g)) + 0.020 * Math.sin(toRad(2 * g))) % 360;
            const e = 23.439 - 0.00000036 * d;

            const sunRA = toDeg(Math.atan2(Math.cos(toRad(e)) * Math.sin(toRad(L)), Math.cos(toRad(L))));
            const sunDec = toDeg(Math.asin(Math.sin(toRad(e)) * Math.sin(toRad(L))));

            const Lp = (218.316 + 13.176396 * d) % 360;
            const Mp = (134.963 + 13.064993 * d) % 360;
            const F = (93.272 + 13.229350 * d) % 360;
            const moonRA = Lp + 6.289 * Math.sin(toRad(Mp));
            const moonDec = 5.128 * Math.sin(toRad(F));

            const GMST = (18.697374558 + 24.06570982441908 * d) % 24;
            const LST = (GMST * 15 + lon) % 360;

            const getAzAlt = (ra, dec) => {
                const ha = (LST - ra + 360) % 360;
                const alt = toDeg(Math.asin(Math.sin(toRad(lat)) * Math.sin(toRad(dec)) + Math.cos(toRad(lat)) * Math.cos(toRad(dec)) * Math.cos(toRad(ha))));
                let az = toDeg(Math.atan2(Math.sin(toRad(ha)), Math.cos(toRad(ha)) * Math.sin(toRad(lat)) - Math.tan(toRad(dec)) * Math.cos(toRad(lat))));
                return { az: (az + 180) % 360, alt: alt, ra, dec };
            };

            return { sun: getAzAlt(sunRA, sunDec), moon: getAzAlt(moonRA, moonDec) };
        }

        function renderLoop() {
            const data = calculateAstro(currentTime, observerLocation.lat, observerLocation.lon);
            
            document.getElementById('sun-pos').innerText = `${data.sun.az.toFixed(1)}° / ${data.sun.alt.toFixed(1)}°`;
            document.getElementById('sun-ra').innerText = `${Math.floor(data.sun.ra/15)}h ${Math.floor((data.sun.ra%15)*4)}m`;
            document.getElementById('moon-pos').innerText = `${data.moon.az.toFixed(1)}° / ${data.moon.alt.toFixed(1)}°`;
            document.getElementById('moon-ra').innerText = `${Math.floor(data.moon.ra/15)}h ${Math.floor((data.moon.ra%15)*4)}m`;

            const azPxPerDeg = 100 / 10;
            document.getElementById('hud-az-scale').style.transform = `translateX(${-(orientation.alpha * azPxPerDeg)}px)`;
            document.getElementById('hud-alt-scale').style.transform = `translateY(${orientation.beta * 8}px)`;

            drawAR(data);
            requestAnimationFrame(renderLoop);
        }

        function drawAR(data) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            // Skala AR diperbesar (40px per derajat) untuk jangkauan visual lebih luas
            const scale = 40; 

            const project = (pos) => {
                let dAz = pos.az - orientation.alpha;
                if (dAz > 180) dAz -= 360;
                if (dAz < -180) dAz += 360;
                return {
                    x: cx + (dAz * scale),
                    y: cy + ((orientation.beta - pos.alt) * scale)
                };
            };

            const sPos = project(data.sun);
            const mPos = project(data.moon);

            // Sun AR
            ctx.shadowBlur = 30; ctx.shadowColor = "orange";
            ctx.fillStyle = "rgba(255, 165, 0, 0.4)";
            ctx.beginPath(); ctx.arc(sPos.x, sPos.y, 35, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = "rgba(255,255,255,0.3)"; ctx.stroke();

            // Moon AR
            ctx.shadowColor = "white";
            ctx.fillStyle = "rgba(255, 255, 255, 0.5)";
            ctx.beginPath(); ctx.arc(mPos.x, mPos.y, 20, 0, Math.PI*2); ctx.fill();
            
            ctx.shadowBlur = 0;
        }

        function focusTarget(type) {
            const data = calculateAstro(currentTime, observerLocation.lat, observerLocation.lon);
            const target = type === 'sun' ? data.sun : data.moon;
            orientation.alpha = target.az;
            orientation.beta = -target.alt;
        }

        function updateClock() {
            if (isRealTime) currentTime = new Date();
            document.getElementById('clock-display').innerText = currentTime.toLocaleTimeString('id-ID', { hour12: false });
            document.getElementById('date-display').innerText = currentTime.toLocaleDateString('id-ID', { day:'2-digit', month:'short', year:'numeric' }).toUpperCase();
            document.getElementById('sim-date-label').innerText = currentTime.toLocaleDateString('id-ID', { day:'2-digit', month:'long', year:'numeric' }).toUpperCase();
        }

        document.getElementById('time-slider').oninput = (e) => {
            isRealTime = false;
            document.getElementById('display-mode').innerText = "SIMULASI";
            document.getElementById('display-mode').classList.add('text-orange-500');
            const now = new Date();
            currentTime = new Date(now.getTime() + e.target.value * 60000);
            updateClock();
        };

        function resetApp() {
            isRealTime = true;
            document.getElementById('time-slider').value = 0;
            document.getElementById('display-mode').innerText = "REAL TIME";
            document.getElementById('display-mode').classList.remove('text-orange-500');
            updateClock();
        }

        function changeDay(offset) {
            isRealTime = false;
            currentTime.setDate(currentTime.getDate() + offset);
            updateClock();
        }

        function startCamera() {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
                .then(stream => document.getElementById('video').srcObject = stream)
                .catch(() => console.log("Kamera tidak tersedia"));
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
    </script>
</body>
</html>
