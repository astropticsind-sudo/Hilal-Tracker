<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AstroCam AR - Find The Sun & Moon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; color: #00ffcc; font-family: 'Courier New', Courier, monospace; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 10; pointer-events: none; }
        #video-feed { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        .hud-container { position: absolute; width: 100%; height: 100%; z-index: 20; pointer-events: none; }
        
        /* UI Elements */
        .top-bar { position: absolute; top: 0; left: 0; width: 100%; padding: 10px; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); display: flex; justify-content: space-between; align-items: flex-start; pointer-events: auto; }
        .bottom-controls { position: absolute; bottom: 0; left: 0; width: 100%; padding: 20px; padding-bottom: 40px; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: auto; }
        
        .data-box { background: rgba(0, 20, 0, 0.5); border: 1px solid #00ffcc; padding: 5px 10px; border-radius: 4px; font-size: 12px; text-shadow: 0 0 5px #00ffcc; margin-bottom: 5px; }
        
        .btn-action { 
            background: rgba(0, 50, 50, 0.6); border: 1px solid #00ffcc; color: #00ffcc; 
            padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; 
            text-transform: uppercase; transition: 0.3s; font-size: 14px;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
            pointer-events: auto;
        }
        .btn-action:active, .btn-action.active { background: #00ffcc; color: #000; box-shadow: 0 0 20px #00ffcc; }
        
        .shutter-btn {
            width: 70px; height: 70px; border-radius: 50%; border: 3px solid #fff;
            background: rgba(255,255,255,0.2); cursor: pointer; pointer-events: auto;
            display: flex; justify-content: center; align-items: center;
        }
        .shutter-btn:active { background: rgba(255,255,255,0.8); }

        .voice-btn-container {
            display: flex; flex-direction: column; align-items: center; margin-bottom: 10px;
        }
        .voice-label {
            font-size: 10px; color: #fff; margin-top: 4px; text-shadow: 0 0 2px black;
            opacity: 0.8; letter-spacing: 1px;
        }
        .mic-btn {
            width: 40px; height: 40px; border-radius: 50%; border: 1px solid #00ffcc;
            background: rgba(0,0,0,0.5); color: #00ffcc; display: flex; justify-content: center; align-items: center;
            cursor: pointer; pointer-events: auto; transition: 0.3s;
        }
        .mic-btn.listening { background: #ff3333; border-color: #ff3333; color: white; animation: pulse 1.5s infinite; }

        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 51, 51, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(255, 51, 51, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 51, 51, 0); } }

        /* Guide Arrows */
        .guide-arrow {
            position: absolute; width: 0; height: 0; 
            border-left: 15px solid transparent; border-right: 15px solid transparent;
            z-index: 15; opacity: 0; transition: opacity 0.3s; pointer-events: none;
        }
        .guide-arrow.up { border-bottom: 25px solid #ffcc00; top: 20%; left: 50%; transform: translateX(-50%); }
        .guide-arrow.down { border-top: 25px solid #ffcc00; bottom: 20%; left: 50%; transform: translateX(-50%); }
        .guide-arrow.left { border-right: 25px solid #ffcc00; left: 10%; top: 50%; transform: translateY(-50%); }
        .guide-arrow.right { border-left: 25px solid #ffcc00; right: 10%; top: 50%; transform: translateY(-50%); }

        #permission-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; p: 20px;
        }
    </style>
</head>
<body>

    <!-- Permission Modal -->
    <div id="permission-modal">
        <h2 class="text-2xl text-cyan-400 mb-4"><i class="fas fa-satellite-dish"></i> AstroCam AR</h2>
        <p class="text-gray-300 mb-6 max-w-md px-4">Izinkan akses Kamera dan Sensor Orientasi untuk menggunakan fitur AR dan kompas astronomi.</p>
        <button onclick="startApp()" class="btn-action" style="font-size: 18px; padding: 15px 40px;">MULAI / KALIBRASI</button>
    </div>

    <!-- Video Background -->
    <video id="video-feed" autoplay playsinline muted></video>

    <!-- AR Canvas Layer -->
    <canvas id="ar-canvas"></canvas>

    <!-- Guide Arrows (Visual cues to turn phone) -->
    <div id="arrow-up" class="guide-arrow up"></div>
    <div id="arrow-down" class="guide-arrow down"></div>
    <div id="arrow-left" class="guide-arrow left"></div>
    <div id="arrow-right" class="guide-arrow right"></div>

    <!-- HUD Container -->
    <div class="hud-container">
        <!-- Top Info -->
        <div class="top-bar">
            <div>
                <div class="data-box" id="coords">Lat: -- Lon: --</div>
                <div class="data-box" id="orientation">Az: 0° | Alt: 0°</div>
            </div>
            <div class="text-right">
                <div class="data-box text-yellow-400" id="sun-data">Sun: --</div>
                <div class="data-box text-gray-300" id="moon-data">Moon: --</div>
            </div>
        </div>

        <!-- Center Crosshair (Static HTML fallback if canvas fails, but we draw on canvas usually) -->
        <div style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); width: 40px; height: 40px; border: 1px solid rgba(0,255,204,0.3); pointer-events:none;"></div>
        <div style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); width: 4px; height: 4px; background: #ff3333; border-radius:50%; pointer-events:none;"></div>

        <!-- Bottom Controls -->
        <div class="bottom-controls">
            
            <!-- Target Selection -->
            <div class="flex gap-4 mb-4">
                <button id="btn-sun" class="btn-action" onclick="toggleTarget('sun')"><i class="fas fa-sun"></i> FIND THE SUN</button>
                <button id="btn-moon" class="btn-action" onclick="toggleTarget('moon')"><i class="fas fa-moon"></i> FIND THE MOON</button>
            </div>

            <!-- Voice & Shutter -->
            <div class="flex items-center gap-6">
                <!-- Voice Trigger -->
                <div class="voice-btn-container">
                    <button id="btn-voice" class="mic-btn" onclick="toggleVoice()">
                        <i class="fas fa-microphone"></i>
                    </button>
                    <span class="voice-label">KATAKAN "AMBIL"<br>UNTUK MEMOTRET</span>
                </div>

                <!-- Main Shutter -->
                <button class="shutter-btn" onclick="takePhoto()">
                    <div style="width: 50px; height: 50px; background: white; border-radius: 50%;"></div>
                </button>
                
                <!-- Spacer for balance -->
                <div style="width: 50px;"></div> 
            </div>
        </div>
    </div>

    <script>
        // --- State Management ---
        const state = {
            tracking: null, // 'sun' or 'moon' or null
            azimuth: 0,     // Compass heading (0-360)
            altitude: 0,    // Pitch (-90 to 90)
            lat: -6.9175,   // Default (Bandung)
            lon: 107.6191,
            sunPos: { az: 0, alt: 0 },
            moonPos: { az: 0, alt: 0 },
            listening: false
        };

        // --- DOM Elements ---
        const video = document.getElementById('video-feed');
        const canvas = document.getElementById('ar-canvas');
        const ctx = canvas.getContext('2d');
        const elCoords = document.getElementById('coords');
        const elOrient = document.getElementById('orientation');
        const elSun = document.getElementById('sun-data');
        const elMoon = document.getElementById('moon-data');
        const arrowUp = document.getElementById('arrow-up');
        const arrowDown = document.getElementById('arrow-down');
        const arrowLeft = document.getElementById('arrow-left');
        const arrowRight = document.getElementById('arrow-right');
        const btnVoice = document.getElementById('btn-voice');

        // --- Initialization ---
        function startApp() {
            document.getElementById('permission-modal').style.display = 'none';
            initCamera();
            initSensors();
            initGeolocation();
            
            // Start loops
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();
            requestAnimationFrame(renderLoop);
            setInterval(updateAstroPositions, 1000); // Update astro calc every second
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        // --- Camera Setup ---
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                video.srcObject = stream;
            } catch (err) {
                alert("Gagal akses kamera: " + err.message);
            }
        }

        // --- Voice Recognition Setup ---
        let recognition;
        function initVoice() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.lang = 'id-ID';
                recognition.continuous = true;
                recognition.interimResults = false;

                recognition.onresult = (event) => {
                    const last = event.results.length - 1;
                    const transcript = event.results[last][0].transcript.trim().toLowerCase();
                    console.log("Voice heard:", transcript);

                    if (transcript.includes('ambil') || transcript.includes('foto') || transcript.includes('cekrek')) {
                        flashScreen();
                        takePhoto();
                    }
                };

                recognition.onerror = (event) => {
                    console.log('Voice error:', event.error);
                    state.listening = false;
                    updateVoiceUI();
                };
                
                recognition.onend = () => {
                    if (state.listening) recognition.start(); // Auto restart if supposed to be listening
                };
            } else {
                alert("Browser ini tidak mendukung Voice Recognition.");
                btnVoice.style.display = 'none';
            }
        }

        function toggleVoice() {
            if (!recognition) initVoice();
            
            state.listening = !state.listening;
            updateVoiceUI();
            
            if (state.listening) {
                recognition.start();
            } else {
                recognition.stop();
            }
        }

        function updateVoiceUI() {
            if (state.listening) {
                btnVoice.classList.add('listening');
            } else {
                btnVoice.classList.remove('listening');
            }
        }

        function flashScreen() {
            const flash = document.createElement('div');
            flash.style.position = 'fixed';
            flash.style.top = '0'; flash.style.left = '0';
            flash.style.width = '100%'; flash.style.height = '100%';
            flash.style.background = 'white';
            flash.style.zIndex = '1000';
            flash.style.opacity = '0.8';
            flash.style.transition = 'opacity 0.2s';
            document.body.appendChild(flash);
            setTimeout(() => { flash.style.opacity = '0'; }, 50);
            setTimeout(() => { flash.remove(); }, 250);
        }

        // --- Sensor Setup (Compass & Gyro) ---
        function initSensors() {
            if (window.DeviceOrientationEvent && typeof window.DeviceOrientationEvent.requestPermission === 'function') {
                // iOS 13+ logic
                window.DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                        } else {
                            alert("Izin sensor ditolak.");
                        }
                    })
                    .catch(console.error);
            } else {
                // Android / Non-iOS
                window.addEventListener('deviceorientationabsolute', handleOrientation, true); // Try absolute first
                window.addEventListener('deviceorientation', handleOrientation, true);
            }
        }

        function handleOrientation(e) {
            let compass = e.webkitCompassHeading || Math.abs(e.alpha - 360);
            
            // Android fallback logic (simplified) if webkitCompassHeading not available
            if (!e.webkitCompassHeading && e.alpha) {
                compass = 360 - e.alpha; 
            }

            state.azimuth = compass % 360;
            // Beta is usually pitch (-180 to 180). We clamp for easier display.
            // In portrait mode held up: Beta is roughly 90. Horizon is 90.
            // We need to map sensor beta to "Camera Pitch".
            // Typically: 90 deg = Horizon. 
            state.altitude = e.beta; 
            
            // Update UI
            elOrient.innerText = `Az: ${Math.round(state.azimuth)}° | Alt: ${Math.round(state.altitude)}°`;
        }

        function initGeolocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    state.lat = pos.coords.latitude;
                    state.lon = pos.coords.longitude;
                    elCoords.innerText = `Lat: ${state.lat.toFixed(2)} Lon: ${state.lon.toFixed(2)}`;
                    updateAstroPositions();
                });
            }
        }

        // --- Astro Math (Simplified Approximation) ---
        // Just enough to show the "Find" feature works. For real precision, use a library.
        function updateAstroPositions() {
            const date = new Date();
            // Simplified Sun Position Logic (placeholder math for demo)
            // Real calc would involve Julian Date, Ecliptic coord, etc.
            
            // Mocking movement based on time of day
            const hour = date.getHours() + date.getMinutes()/60;
            // Sun rises East (90), sets West (270). High at noon.
            // Simple mapping for demo:
            let sunAz = 180; 
            let sunAlt = -90;
            
            if(hour > 6 && hour < 18) {
                sunAlt = 90 - Math.abs(12 - hour) * 15; // Rough peak at noon
                sunAz = 90 + (hour - 6) * 15; 
            }
            
            state.sunPos = { az: sunAz, alt: sunAlt };
            
            // Moon: Just offset from sun for demo purposes (or random fixed for stability)
            state.moonPos = { az: (sunAz + 180) % 360, alt: 45 }; 

            elSun.innerText = `Sun: ${Math.round(state.sunPos.az)}° / ${Math.round(state.sunPos.alt)}°`;
            elMoon.innerText = `Moon: ${Math.round(state.moonPos.az)}° / ${Math.round(state.moonPos.alt)}°`;
        }

        // --- Logic: Find Target ---
        function toggleTarget(target) {
            // Remove active classes
            document.getElementById('btn-sun').classList.remove('active');
            document.getElementById('btn-moon').classList.remove('active');
            
            if (state.tracking === target) {
                state.tracking = null; // Turn off
                hideArrows();
            } else {
                state.tracking = target;
                document.getElementById('btn-' + target).classList.add('active');
            }
        }

        function updateGuideArrows(targetAz, targetAlt) {
            if (!state.tracking) return;

            const currentAz = state.azimuth;
            const currentAlt = state.altitude;

            // Calculate smallest difference in Azimuth
            let diffAz = targetAz - currentAz;
            if (diffAz > 180) diffAz -= 360;
            if (diffAz < -180) diffAz += 360;

            let diffAlt = targetAlt - currentAlt;

            // Threshold to show arrows
            const threshold = 5; 

            // Horizontal
            if (diffAz > threshold) {
                arrowRight.style.opacity = 1; arrowLeft.style.opacity = 0;
            } else if (diffAz < -threshold) {
                arrowRight.style.opacity = 0; arrowLeft.style.opacity = 1;
            } else {
                arrowRight.style.opacity = 0; arrowLeft.style.opacity = 0;
            }

            // Vertical
            if (diffAlt > threshold) {
                arrowUp.style.opacity = 1; arrowDown.style.opacity = 0;
            } else if (diffAlt < -threshold) {
                arrowUp.style.opacity = 0; arrowDown.style.opacity = 1;
            } else {
                arrowUp.style.opacity = 0; arrowDown.style.opacity = 0;
            }
            
            // If "Locked on" (within threshold)
            if (Math.abs(diffAz) < threshold && Math.abs(diffAlt) < threshold) {
                // Change crosshair color logic could go here
            }
        }

        function hideArrows() {
            arrowUp.style.opacity = 0;
            arrowDown.style.opacity = 0;
            arrowLeft.style.opacity = 0;
            arrowRight.style.opacity = 0;
        }

        // --- Rendering (The "Fix" for Centering) ---
        function renderLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const w = canvas.width;
            const h = canvas.height;
            const cx = w / 2;
            const cy = h / 2;
            
            // Field of View (approx) - determines pixels per degree
            const fov = 60; 
            const pxPerDeg = h / fov; 

            // 1. Draw Crosshair (STATIC in center)
            ctx.strokeStyle = '#00ffcc';
            ctx.lineWidth = 2;
            ctx.beginPath();
            // Horizontal dash
            ctx.moveTo(cx - 20, cy); ctx.lineTo(cx + 20, cy);
            // Vertical dash
            ctx.moveTo(cx, cy - 20); ctx.lineTo(cx, cy + 20);
            ctx.stroke();

            // Circle around center
            ctx.beginPath();
            ctx.arc(cx, cy, 30, 0, Math.PI*2);
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.3)';
            ctx.stroke();

            // 2. Draw Horizon & Altitude Grid
            // The grid moves OPPOSITE to device pitch.
            // If device pitches UP (+), grid moves DOWN.
            
            // Current Device Altitude defines what degree is at center (cy)
            const centerAlt = state.altitude; 
            
            // Draw Horizon (0 degrees altitude)
            const horizonY = cy + (centerAlt - 0) * pxPerDeg; 
            
            ctx.strokeStyle = '#ff3333'; // Red for horizon
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, horizonY);
            ctx.lineTo(w, horizonY);
            ctx.stroke();
            ctx.fillStyle = '#ff3333';
            ctx.fillText("HORIZON", 10, horizonY - 5);

            // Draw other altitude lines (e.g., every 10 degrees)
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.3)';
            ctx.fillStyle = 'rgba(0, 255, 204, 0.7)';
            ctx.textAlign = 'center';
            
            // Only draw lines visible on screen to save perf
            const minVisAlt = centerAlt - (fov/2) - 10;
            const maxVisAlt = centerAlt + (fov/2) + 10;

            for (let a = -90; a <= 90; a += 10) {
                if (a === 0) continue; // Already drew horizon
                if (a < minVisAlt || a > maxVisAlt) continue;

                const y = cy + (centerAlt - a) * pxPerDeg;
                
                ctx.beginPath();
                ctx.moveTo(cx - 50, y);
                ctx.lineTo(cx + 50, y); // Small center line
                ctx.stroke();
                
                ctx.fillText(a + "°", cx + 60, y + 4);
            }

            // 3. Draw Azimuth (Compass) Strip
            // Drawn at top or bottom, sliding based on state.azimuth
            const stripY = h * 0.2;
            const pxPerDegAz = w / 90; // Show 90 degrees of compass at once
            const centerAz = state.azimuth;
            
            ctx.font = "14px Courier New";
            for (let i = 0; i < 360; i += 15) {
                let diff = i - centerAz;
                // Wrap around logic
                if (diff < -180) diff += 360;
                if (diff > 180) diff -= 360;
                
                if (Math.abs(diff) > 50) continue; // Optimization

                const x = cx + diff * pxPerDegAz;
                
                // Draw tick
                ctx.beginPath();
                ctx.moveTo(x, stripY);
                ctx.lineTo(x, stripY - 10);
                ctx.stroke();
                
                // Draw label
                let label = i + "°";
                if (i === 0) label = "N";
                if (i === 90) label = "E";
                if (i === 180) label = "S";
                if (i === 270) label = "W";
                
                ctx.fillText(label, x, stripY - 15);
            }

            // 4. Draw Targets (Sun/Moon)
            if (state.tracking) {
                const target = state.tracking === 'sun' ? state.sunPos : state.moonPos;
                updateGuideArrows(target.az, target.alt);
                
                // Calculate position on screen
                let azDiff = target.az - state.azimuth;
                if (azDiff > 180) azDiff -= 360;
                if (azDiff < -180) azDiff += 360;
                
                const tX = cx + azDiff * pxPerDeg; // Use same scale for horizontal approx
                const tY = cy + (state.altitude - target.alt) * pxPerDeg;

                // Only draw if roughly within view
                if (tX > -100 && tX < w + 100 && tY > -100 && tY < h + 100) {
                    ctx.save();
                    ctx.translate(tX, tY);
                    
                    // Target Circle
                    ctx.beginPath();
                    ctx.arc(0, 0, 40, 0, Math.PI*2);
                    ctx.strokeStyle = state.tracking === 'sun' ? '#ffff00' : '#ffffff';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    
                    // Cross inside target
                    ctx.beginPath();
                    ctx.moveTo(-50, 0); ctx.lineTo(50, 0);
                    ctx.moveTo(0, -50); ctx.lineTo(0, 50);
                    ctx.stroke();

                    ctx.fillStyle = state.tracking === 'sun' ? '#ffff00' : '#ffffff';
                    ctx.fillText(state.tracking === 'sun' ? "SUN" : "MOON", 0, -50);
                    
                    ctx.restore();
                }
            }

            requestAnimationFrame(renderLoop);
        }

        // --- Screenshot Logic ---
        function takePhoto() {
            // Flash effect is handled by voice logic too, but here for button click
            const flash = document.createElement('div');
            flash.style.cssText = "position:fixed;top:0;left:0;width:100%;height:100%;background:white;z-index:999;opacity:1;transition:opacity 0.5s";
            document.body.appendChild(flash);
            setTimeout(() => flash.style.opacity = 0, 50);
            setTimeout(() => flash.remove(), 550);

            // Create a temporary canvas to combine video + AR
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = video.videoWidth || canvas.width;
            tempCanvas.height = video.videoHeight || canvas.height;
            const tCtx = tempCanvas.getContext('2d');
            
            // Draw Video
            tCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);
            // Draw AR Overlay (Scaled)
            tCtx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
            
            // Download
            const link = document.createElement('a');
            link.download = `AstroCam-${Date.now()}.png`;
            link.href = tempCanvas.toDataURL('image/png');
            link.click();
        }

    </script>
</body>
</html>
