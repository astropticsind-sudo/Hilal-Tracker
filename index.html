                                <div>
                                    <h1 className="text-xl font-bold tracking-tight text-white">AstroCam Compare</h1>
                                    <p className="text-xs text-gray-400">Database & Perbandingan Kamera Astronomi Profesional (Total: {cameraDatabase.length} Kamera)</p>
                                </div>
                            </div>

                            {compareList.length > 0 && (
                                <button 
                                    onClick={() => setIsModalOpen(true)}
                                    className="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-5 py-2.5 rounded-xl shadow-lg shadow-indigo-600/30 transition flex items-center gap-2 text-sm animate-pulse"
                                >
                                    <span>Bandingkan Kamera ({compareList.length}/3)</span>
                                    <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7" />
                                    </svg>
                                </button>
                            )}
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
                        <div className="bg-dark-800 p-4 sm:p-6 rounded-2xl border border-dark-700 shadow-xl mb-8 flex flex-col gap-4">
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div className="relative">
                                    <span className="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">
                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                                    </span>
                                    <input 
                                        type="text" 
                                        placeholder="Cari kamera atau sensor (cth: IMX571, ZWO, ToupTek)..." 
                                        value={searchTerm}
                                        onChange={(e) => setSearchTerm(e.target.value)}
                                        className="w-full pl-10 pr-4 py-2.5 bg-dark-900 border border-dark-700 rounded-xl text-sm focus:outline-none focus:border-indigo-500 text-gray-200 placeholder-gray-500"
                                    />
                                </div>

                                <div className="flex items-center gap-2 overflow-x-auto pb-1 md:pb-0">
                                    {brands.map(brand => (
                                        <button
                                            key={brand}
                                            onClick={() => setSelectedBrand(brand)}
                                            className={`px-3.5 py-2 rounded-xl text-xs font-medium whitespace-nowrap transition ${selectedBrand === brand ? 'bg-indigo-600 text-white shadow' : 'bg-dark-900 text-gray-400 hover:text-white border border-dark-700'}`}
                                        >
                                            {brand}
                                        </button>
                                    ))}
                                </div>

                                <div className="flex items-center gap-2 overflow-x-auto pb-1 md:pb-0 justify-start md:justify-end">
                                    {types.map(type => (
                                        <button
                                            key={type}
                                            onClick={() => setSelectedType(type)}
                                            className={`px-3 py-2 rounded-xl text-xs font-medium whitespace-nowrap transition ${selectedType === type ? 'bg-emerald-600 text-white shadow' : 'bg-dark-900 text-gray-400 hover:text-white border border-dark-700'}`}
                                        >
                                            {type}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {filteredCameras.map(cam => {
                                const isCompared = compareList.includes(cam.id);
                                return (
                                    <div key={cam.id} className="bg-dark-800 border border-dark-700 rounded-2xl p-5 flex flex-col justify-between shadow-lg hover:border-indigo-500/50 transition group">
                                        <div>
                                            <div className="flex justify-between items-start gap-2 mb-3">
                                                <span className="text-xs font-semibold px-2.5 py-1 rounded-md bg-indigo-950 text-indigo-300 border border-indigo-800/50">
                                                    {cam.brand}
                                                </span>
                                                <span className={`text-xs px-2.5 py-1 rounded-md border ${
                                                    cam.type.includes('Cooled') ? 'bg-blue-950 text-blue-300 border-blue-800/50' :
                                                    cam.type.includes('Planetary') ? 'bg-amber-950 text-amber-300 border-amber-800/50' :
                                                    'bg-purple-950 text-purple-300 border-purple-800/50'
                                                }`}>
                                                    {cam.type}
                                                </span>
                                            </div>

                                            <h3 className="text-lg font-bold text-white mb-1 group-hover:text-indigo-400 transition">{cam.name}</h3>
                                            <p className="text-xs text-indigo-300 font-mono mb-4">{cam.sensor}</p>

                                            <div className="space-y-2 text-xs border-t border-dark-700 pt-3 text-gray-300">
                                                <div className="flex justify-between">
                                                    <span className="text-gray-400">Resolusi:</span>
                                                    <span className="font-medium text-gray-200">{cam.resolution}</span>
                                                </div>
                                                <div className="flex justify-between">
                                                    <span className="text-gray-400">Ukuran Pixel:</span>
                                                    <span className="font-medium text-gray-200">{cam.pixelSize}</span>
                                                </div>
                                                <div className="flex justify-between">
                                                    <span className="text-gray-400">Format Sensor:</span>
                                                    <span className="font-medium text-gray-200">{cam.sensorSize}</span>
                                                </div>
                                                <div className="flex justify-between">
                                                    <span className="text-gray-400">QE (Sensitivitas):</span>
                                                    <span className="font-medium text-emerald-400">{cam.qe}</span>
                                                </div>
                                                <div className="flex justify-between">
                                                    <span className="text-gray-400">Pendingin:</span>
                                                    <span className="font-medium text-gray-200">{cam.cooling}</span>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="mt-6 pt-3 border-t border-dark-700">
                                            <button
                                                onClick={() => toggleCompare(cam.id)}
                                                className={`w-full py-2.5 px-4 rounded-xl text-xs font-semibold transition flex items-center justify-center gap-2 ${
                                                    isCompared 
                                                    ? 'bg-rose-500/10 text-rose-400 border border-rose-500/30 hover:bg-rose-500/20' 
                                                    : 'bg-dark-900 text-gray-300 border border-dark-700 hover:border-indigo-500 hover:text-white'
                                                }`}
                                            >
                                                {isCompared ? 'Hapus dari Perbandingan' : 'Tambah untuk Perbandingan'}
                                            </button>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </main>

                    {isModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 overflow-y-auto">
                            <div className="bg-dark-800 border border-dark-700 w-full max-w-5xl rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
                                <div className="flex justify-between items-center p-6 border-b border-dark-700">
                                    <h2 className="text-lg font-bold text-white flex items-center gap-2">
                                        <span>Matriks Perbandingan Kamera</span>
                                        <span className="text-xs bg-indigo-600 px-2 py-0.5 rounded-full text-white">{compareList.length} Dipilih</span>
                                    </h2>
                                    <button onClick={() => setIsModalOpen(false)} className="text-gray-400 hover:text-white bg-dark-900 p-2 rounded-xl border border-dark-700">✕</button>
                                </div>

                                <div className="p-6 overflow-x-auto flex-grow">
                                    <div className="min-w-[600px] grid grid-cols-4 gap-4">
                                        <div className="space-y-4 font-semibold text-xs text-gray-400 pt-28">
                                            <div className="py-2 border-b border-dark-700">Brand</div>
                                            <div className="py-2 border-b border-dark-700">Kategori Tipe</div>
                                            <div className="py-2 border-b border-dark-700">Sensor</div>
                                            <div className="py-2 border-b border-dark-700">Resolusi</div>
                                            <div className="py-2 border-b border-dark-700">Ukuran Pixel</div>
                                            <div className="py-2 border-b border-dark-700">Format Sensor</div>
                                            <div className="py-2 border-b border-dark-700">QE (Sensitivitas)</div>
                                            <div className="py-2 border-b border-dark-700">Konversi ADC</div>
                                            <div className="py-2 border-b border-dark-700">Read Noise</div>
                                            <div className="py-2 border-b border-dark-700">Sistem Pendingin</div>
                                        </div>

                                        {compareList.map(id => {
                                            const cam = cameraDatabase.find(c => c.id === id);
                                            return (
                                                <div key={cam.id} className="bg-dark-900 p-4 rounded-xl border border-dark-700 flex flex-col justify-between space-y-4 relative">
                                                    <button onClick={() => toggleCompare(cam.id)} className="absolute top-2 right-2 text-rose-400 hover:text-rose-300 text-xs bg-rose-500/10 px-2 py-1 rounded">Hapus</button>
                                                    <div className="h-24 flex flex-col justify-end">
                                                        <span className="text-[10px] text-indigo-400 font-semibold">{cam.brand}</span>
                                                        <h4 className="text-sm font-bold text-white leading-snug">{cam.name}</h4>
                                                    </div>
                                                    <div className="space-y-4 text-xs text-gray-300 pt-2">
                                                        <div className="py-2 border-b border-dark-800 font-medium">{cam.brand}</div>
                                                        <div className="py-2 border-b border-dark-800">{cam.type}</div>
                                                        <div className="py-2 border-b border-dark-800 text-indigo-300">{cam.sensor}</div>
                                                        <div className="py-2 border-b border-dark-800">{cam.resolution}</div>
                                                        <div className="py-2 border-b border-dark-800">{cam.pixelSize}</div>
                                                        <div className="py-2 border-b border-dark-800">{cam.sensorSize}</div>
                                                        <div className="py-2 border-b border-dark-800 text-emerald-400 font-semibold">{cam.qe}</div>
                                                        <div className="py-2 border-b border-dark-800">{cam.adc}</div>
                                                        <div className="py-2 border-b border-dark-800">{cam.readNoise}</div>
                                                        <div className="py-2 border-b border-dark-800">{cam.cooling}</div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    <footer className="border-t border-dark-700 bg-dark-800/40 py-6 text-center text-xs text-gray-500">
                        <p>© 2026 AstroCam Compare. Seluruh hak cipta dilindungi.</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(getElementByIdSafe('root')).render(<App />);
        function getElementByIdSafe(id) { return document.getElementById(id); }
    </script>
</body>
</html>
